<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>خطابات ومذكرات</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Cairo',sans-serif;background:#f7f7f7;text-align:center;padding:40px;}
        h2{color:#328cc0;}
        .book-form {
            max-width: 370px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px #328cc033;
            padding: 18px 12px 8px 12px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #328cc0;
            font-weight: bold;
            font-size: 1em;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #bbb;
            font-size: 1.1em;
            font-family: 'Cairo', sans-serif;
            background: #f7fafd;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #328cc0;
            outline: none;
        }
        @media (max-width: 600px) {
            .book-form {
                max-width: 100vw;
                border-radius: 0;
                box-shadow: none;
                padding: 10px 2px 2px 2px;
            }
            input, select {
                font-size: 1em;
                padding: 10px;
                border-radius: 8px;
            }
            label {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <img src="img/logo-albasmahart2.png" alt="شعار البصمة آرت" style="max-width:300px; margin-bottom:24px; display:block; margin-left:auto; margin-right:auto;">
    <form class="book-form">
        <div class="form-group">
            <label for="B1">المقاس</label>
            <select id="B1" name="B1">
                <option value="">اختر</option>
                <option value="A3">A3</option>
                <option value="A4">A4</option>
                <option value="A5">A5</option>
                <option value="A6">A6</option>
            </select>
        </div>
        <div class="form-group">
            <label for="B2">نوع الورق </label>
            <select id="B2" name="B2">
                <option value="">اختر نوع الورق </option>
            </select>
        </div>
        <div class="form-group">
            <label for="B3">نوع الطباعة</label>
            <select id="B3" name="B3">
                <option value="">اختر نوع الطباعة</option>
                <option value="وجه واحد">وجه واحد</option>
            </select>
        </div>

        <div class="form-group">
            <label for="B4">عدد الأوراق لكل بوك</label>
            <select id="B4" name="B4">
                <option value="">اختر</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>

        <div class="form-group">
            <label for="B5">كمية الأبواك</label>
            <input type="number" id="B5" name="B5" min="1" placeholder="مثال: 10">
        </div>

     <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;">
            <button type="button" id="calculateBtn" style="background:linear-gradient(90deg,#027027 0%,#026e5a 100%);color:#fff;border:none;border-radius:18px;padding:0 0;width:75%;height:62px;font-size:150%;font-weight:bold;cursor:pointer;box-shadow:0 4px 18px #38f9d733;letter-spacing:1px;transition:background 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;">احسب لي</button>
            <button type="button" id="homeBtn" title="الصفحة الرئيسية" style="background:#ec3333;border:none;border-radius:14px;padding:0;box-shadow:0 2px 8px #ffffff2c;cursor:pointer;display:flex;align-items:center;justify-content:center;width:62px;height:62px;min-width:62px;min-height:62px;max-height:62px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
        </div>

    <div style="margin-top:22px;display:flex;gap:22px;flex-wrap:nowrap;justify-content:center;align-items:stretch;">
            <div style="background:linear-gradient(90deg,#ff9900 0%,#745804 100%);color:#fff;padding:15px 18px;border-radius:10px;min-width:50px;font-weight:bold;box-shadow:0 2px 8px #ffc10733;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                <span style="font-size:80%;margin-bottom:6px;">سعر المناديب</span>
                <span id="D6" style="font-size:1.3em;">-</span>
            </div>
            <div style="background:linear-gradient(90deg,#034750 0%,#328cc0 100%);color:#fff;padding:15px 18px;border-radius:10px;min-width:50px;font-weight:bold;box-shadow:0 2px 8px #328cc033;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                <span style="font-size:80%;margin-bottom:6px;">سعر العملاء</span>
                <span id="E6" style="font-size:1.3em;">-</span>
            </div>
        </div>

    </form>
    <!-- قائمة الكشاف -->
    <div id="kashaf-section" style="display:block; margin-top:24px;">
        <label style="color:#328cc0;font-weight:bold;">كشاف</label>
        <ul style="background:#eee;border-radius:8px;padding:12px 10px;list-style:decimal;text-align:right;">
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
                <div style="flex:1;min-width:120px;">
                    <li style="display:block;margin:6px 0;">
                        <span id="C2" style="display:inline-block;width:120px;height:48px;line-height:48px;text-align:center;background:#fff;border:1px solid #bbb;border-radius:8px;font-weight:bold;">C2</span>
                    </li>
                    <li style="display:block;margin:6px 0;">
                        <span id="C3" style="display:inline-block;width:120px;height:48px;line-height:48px;text-align:center;background:#fff;border:1px solid #bbb;border-radius:8px;font-weight:bold;">C3</span>
                        <div id="C3-error" style="color:red;font-size:0.95em;margin-top:4px;"></div>
                    </li>
                    <li style="display:block;margin:6px 0;">
                        <span id="C4" style="display:inline-block;width:120px;height:48px;line-height:48px;text-align:center;background:#fff;border:1px solid #bbb;border-radius:8px;font-weight:bold;">C4</span>
                    </li>
                    <li style="display:block;margin:6px 0;">
                        <span id="C5" style="display:inline-block;width:120px;height:48px;line-height:48px;text-align:center;background:#fff;border:1px solid #bbb;border-radius:8px;font-weight:bold;">C5</span>
                    </li>
                    <li style="display:block;margin:6px 0;">
                        <span id="B10" style="display:inline-block;width:120px;height:48px;line-height:48px;text-align:center;background:#fff;border:1px solid #bbb;border-radius:8px;font-weight:bold;">B10</span>
                        <div id="B10-error" style="color:red;font-size:0.95em;margin-top:4px;"></div>
                    </li>
                </div>
                <div style="flex:1;min-width:120px;">
                    <li style="display:block;margin:6px 0;">
                        <span id="C7" style="display:inline-block;width:120px;height:48px;line-height:48px;text-align:center;background:#fff;border:1px solid #bbb;border-radius:8px;font-weight:bold;">C7</span>
                        <span id="C7-error" style="color:red;font-size:0.95em;display:none;margin-right:8px;"></span>
                    </li>
                    <li style="display:block;margin:6px 0;">
                        <span id="B11" style="display:inline-block;width:120px;height:48px;line-height:48px;text-align:center;background:#fff;border:1px solid #bbb;border-radius:8px;font-weight:bold;">B11</span>
                    </li>
                </div>
            </div>
        </ul>
    </div>
</body>
    <script>
        // تعبئة قائمة نوع الورق الداخلي من السيرفر
        //===========================
        fetch('/inner-paper-types')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('B2');
                if (Array.isArray(data.types)) {
                    data.types.forEach(name => {
                        const option = document.createElement('option');
                        option.value = name;
                        option.textContent = name;
                        select.appendChild(option);
                    });
                }
            });
        //===========================
         // نهاية تعبئة قائمة نوع الورق الداخلي من السيرفر
        //===========================

        ////////////////////////////
        // دالة لحساب قيمة C2
        ////////////////////////////
        function getC2Value(b1, b2, papers) {
            const colMap = { "A3": 6, "A4": 7, "A5": 8, "A6": 9, "A7": 10 };
            const col = colMap[b1];
            if (!col) return 0;
            const row = papers.find(arr => arr[1] === b2);
            if (!row) return 0;
            return row[col] || 0;
        }
        // تحديث قيمة C2 عند تغيير B1 أو B2
        function updateC2() {
            const b1 = document.getElementById('B1').value;
            const b2 = document.getElementById('B2').value;
            fetch('/papers.json')
                .then(res => res.json())
                .then(data => {
                    const papers = data.papers;
                    const c2 = getC2Value(b1, b2, papers);
                    document.getElementById('C2').textContent = (typeof formatNumber !== 'undefined') ? formatNumber(c2, 2) : c2;
                });
        }
        document.getElementById('B1').addEventListener('change', updateC2);
        document.getElementById('B2').addEventListener('change', updateC2);
        //===========================
        // نهاية دالة حساب قيمة C2
        //===========================

        ////////////////////////////
        //===========================
        // دالة لحساب قيمة C3
        //===========================
        function getC3Value(b1, printType, printPrice) {
            if (b1 === "A3" && printType === "وجه واحد") return printPrice * 2;
            if (b1 === "A3" && printType === "وجهين")   return printPrice * 4;
            if (b1 === "A4" && printType === "وجه واحد") return printPrice * 1;
            if (b1 === "A4" && printType === "وجهين")   return printPrice * 2;
            if (b1 === "A5" && printType === "وجه واحد") return printPrice / 2;
            if (b1 === "A5" && printType === "وجهين")   return printPrice * 1;
            if (b1 === "A6" && printType === "وجه واحد") return printPrice / 4;
            if (b1 === "A6" && printType === "وجهين")   return printPrice / 2;
            if (b1 === "A7" && printType === "وجه واحد") return printPrice / 8;
            if (b1 === "A7" && printType === "وجهين")   return printPrice / 4;
            return 0;
        }
        function updateC3() {
            var b1 = document.getElementById('B1');
            var b3 = document.getElementById('B3');
            var c3 = document.getElementById('C3');
            var c3Error = document.getElementById('C3-error');
            if (!b1 || !b3 || !c3) {
                if (c3Error) c3Error.textContent = 'تعذر حساب C3: أحد الحقول غير موجود.';
                return;
            }
            fetch('/settings.json')
                .then(res => res.json())
                .then(settings => {
                    var printPrice = settings.printPrice;
                    var val = getC3Value(b1.value, b3.value, printPrice);
                    if (val === 0 || isNaN(val)) {
                        c3.textContent = 'C3';
                        c3Error.textContent = 'تعذر حساب C3: تحقق من اختيار المقاس ونوع الطباعة.';
                    } else {
                        c3.textContent = (typeof formatNumber !== 'undefined') ? formatNumber(val, 2) : val;
                        c3Error.textContent = '';
                    }
                })
                .catch(function() {
                    if (c3Error) c3Error.textContent = 'تعذر جلب بيانات settings.json';
                });
        }
        document.addEventListener('DOMContentLoaded', function() {
            var b1 = document.getElementById('B1');
            var b3 = document.getElementById('B3');
            if (b1 && b3) {
                b1.addEventListener('change', updateC3);
                b3.addEventListener('change', updateC3);
                updateC3();
            }
        });
        //===========================
        // نهاية دالة حساب قيمة C3
        //===========================

            ////////////////////////////
            //===========================
            // قاعدة c4
            //===========================
            // دالة لحساب قيمة C4 حسب معادلة VLOOKUP المطلوبة
        function getC4Value(b2, c2, c3, b4, papers) {
            // ابحث عن الصف المناسب لنوع الورق
            const row = papers.find(arr => arr[1] === b2);
            if (!row) return 0;
            const v1 = parseFloat(row[3]); // العمود 4
            const v2 = parseFloat(row[5]); // العمود 6
            c2 = parseFloat(c2);
            c3 = parseFloat(c3);
            b4 = parseFloat(b4);
            if (isNaN(v1) || isNaN(v2) || isNaN(c2) || isNaN(c3) || isNaN(b4) || v2 === 0 || c2 === 0) return 0;
            return ((v1 / v2) / c2) * b4 + c3;
        }

        function updateC4() {
            var b2 = document.getElementById('B2');
            var c2 = document.getElementById('C2');
            var c3 = document.getElementById('C3');
            var b4 = document.getElementById('B4');
            var c4 = document.getElementById('C4');
            if (!b2 || !c2 || !c3 || !b4 || !c4) return;
            fetch('/papers.json')
                .then(res => res.json())
                .then(data => {
                    var val = getC4Value(b2.value, c2.textContent, c3.textContent, b4.value, data.papers);
                    c4.textContent = (typeof formatNumber !== 'undefined') ? formatNumber(val, 2) : val;
                })
                .catch(function() {
                    c4.textContent = 'خطأ في جلب papers';
                });
        }
        // تحديث C4 عند تغيير B2 أو C2 أو C3 أو B4
        document.addEventListener('DOMContentLoaded', function() {
            var b2 = document.getElementById('B2');
            var c2 = document.getElementById('C2');
            var c3 = document.getElementById('C3');
            var b4 = document.getElementById('B4');
            if (b2) b2.addEventListener('change', updateC4);
            if (c2) (new MutationObserver(updateC4)).observe(c2, { childList: true });
            if (c3) (new MutationObserver(updateC4)).observe(c3, { childList: true });
            if (b4) b4.addEventListener('change', updateC4);
            updateC4();
        });
        //===========================
        // نهاية قاعدة c4
        //===========================

          /////////////////////////
        //===========================
        // قاعدة c5
        //===========================
        function getC5Value(c4, b5) {
            c4 = parseFloat(c4);
            b5 = parseFloat(b5);
            if (isNaN(c4) || isNaN(b5)) return 0;
            return (c4 * b5) + (0.1 * b5);
        }

        function updateC5() {
            var c4 = document.getElementById('C4');
            var b5 = document.getElementById('B5');
            var c5 = document.getElementById('C5');
            if (!c4 || !b5 || !c5) return;
            var val = getC5Value(c4.textContent, b5.value);
            c5.textContent = Number(val).toFixed(3);
        }
        // تحديث C5 عند تغيير C4 أو B5
        document.addEventListener('DOMContentLoaded', function() {
            var c4 = document.getElementById('C4');
            var b5 = document.getElementById('B5');
            if (c4) (new MutationObserver(updateC5)).observe(c4, { childList: true });
            if (b5) b5.addEventListener('input', updateC5);
            updateC5();
        });
        //===========================
        // نهاية قاعدة c5
        //===========================


        ////////////////////////////
        //===========================
        // قاعدة C7
        //===========================
        function getC7Value(c5) {
            c5 = parseFloat(c5);
            if (isNaN(c5)) return 0;
            return c5 * 2;
        }

        function updateC7() {
            var c5 = document.getElementById('C5');
            var c7 = document.getElementById('C7');
            if (!c5 || !c7) return;
            var val = getC7Value(c5.textContent);
            c7.textContent = Number(val).toFixed(3);
        }
        // تحديث C7 عند تغيير C5
        document.addEventListener('DOMContentLoaded', function() {
            var c5 = document.getElementById('C5');
            if (c5) (new MutationObserver(updateC7)).observe(c5, { childList: true });
            updateC7();
        });
        //===========================
        // نهاية قاعدة C7
        //===========================

        ////////////////////////////
         //===========================
        // قاعدة B10
        //===========================
        function getB10Value(c7, letterPercent) {
            c7 = parseFloat(c7);
            letterPercent = parseFloat(letterPercent);
            if (isNaN(c7) || isNaN(letterPercent)) return 0;
            return c7 + (c7 * (letterPercent / 100));
        }

        function updateB10() {
            var c7 = document.getElementById('C7');
            var b10 = document.getElementById('B10');
            var b10Error = document.getElementById('B10-error');
            if (!c7 || !b10) return;
            fetch('/settings.json')
                .then(res => res.json())
                .then(settings => {
                    var val = getB10Value(c7.textContent, settings.letterPercent);
                    b10.textContent = Number(val).toFixed(3);
                    if (b10Error) b10Error.textContent = '';
                })
                .catch(function() {
                    if (b10Error) b10Error.textContent = 'تعذر جلب بيانات settings.json';
                });
        }
        // تحديث B10 عند تغيير C7
        document.addEventListener('DOMContentLoaded', function() {
            var c7 = document.getElementById('C7');
            if (c7) (new MutationObserver(updateB10)).observe(c7, { childList: true });
            updateB10();
        });
        //===========================
        // نهاية قاعدة B10
        //===========================

        ////////////////////////////
        //===========================
        // قاعدة B11
        //===========================
        function getB11Value(b10) {
            b10 = parseFloat(b10) || 0;
            return b10 < 30 ? 30 : b10;
        }

        function updateB11() {
            var b10 = document.getElementById('B10');
            var b11 = document.getElementById('B11');
            if (!b10 || !b11) return;
            var val = getB11Value(b10.textContent);
            b11.textContent = Number(val).toFixed(3);
        }
        // تحديث B11 عند تغيير B10
        document.addEventListener('DOMContentLoaded', function() {
            var b10 = document.getElementById('B10');
            if (b10) (new MutationObserver(updateB11)).observe(b10, { childList: true });
            updateB11();
        });
        //===========================
        // نهاية قاعدة B11
        //===========================


         /////////////////////////////////
            // ==========================
            // تحديث D6 وE6 عند تحميل الصفحة لأول مرة
            // ==========================
            window.addEventListener('DOMContentLoaded', function() {
                // إذا كان حقل الكمية غير فارغ، احسب D6 وE6
                var b4 = document.getElementById('B4');
                if (b4 && b4.value) {
                    // نفذ نفس منطق زر احسب لي
                    var evt = new Event('click');
                    document.getElementById('calculateBtn').dispatchEvent(evt);
                }
            });

            // عند تغيير الكمية، إذا كان الحقل فارغاً امسح D6 وE6
            document.getElementById('B4').addEventListener('input', function() {
                var b4 = document.getElementById('B4');
                if (!b4.value) {
                    document.getElementById('D6').textContent = '-';
                    document.getElementById('E6').textContent = '-';
                }
            });
            // ==========================
            // نهاية تحديث D6 وE6 عند تحميل الصفحة لأول مرة
            // ==========================


            ///////////////////////////////
         //===========================
        // قاعدة D6 و E6
        //===========================
        function updateD6E6() {
            fetch('/settings.json')
                .then(res => res.json())
                .then(settings => {
                    const b11Value = parseFloat(document.getElementById('B11').textContent) || 0;
                    const vatValue = parseFloat(settings.vat) || 0;
                    // حساب E6: (B11 + (B11 * 0.20)) + ((B11 + (B11 * 0.20)) * vat)
                    const e6Base = b11Value + (b11Value * 0.20);
                    const e6 = e6Base + (e6Base * vatValue);
                    document.getElementById('E6').textContent = e6.toFixed(2);
                    // حساب D6: B11 + (B11 * vat)
                    const d6 = b11Value + (b11Value * vatValue);
                    document.getElementById('D6').textContent = d6.toFixed(2);
                });
        }

        //===========================
        // نهاية قاعدة D6 و E6
        //===========================

            ///////////////////////////////
            // ==========================
            // زر احسب لي
             // التحقق من الحقول المطلوبة عند الضغط على احسب لي (باستخدام نافذة التحقق الإلزامي)
             // ==========================
        document.getElementById('calculateBtn').addEventListener('click', function(e) {
            var requiredFields = [
                { id: 'B1', name: 'المقاس' },
                { id: 'B2', name: 'نوع الورق' },
                { id: 'B3', name: 'نوع الطباعة' },
                { id: 'B4', name: 'عدد الأوراق لكل بوك' },
                { id: 'B5', name: 'كمية الأبواك' }
            ];
            var emptyFields = [];
            requiredFields.forEach(function(field) {
                var el = document.getElementById(field.id);
                var val = (el && (el.value !== undefined ? el.value : el.textContent));
                if (!val || val === '' || val === 'اختر' || val === 'اختر نوع الورق ' || val === 'اختر نوع الطباعة' || val === 'عدد الأوراق لكل بوك') {
                    emptyFields.push(field.name);
                    if (el) el.style.borderColor = '#d32f2f';
                } else {
                    if (el) el.style.borderColor = '';
                }
            });
            
            // إذا كانت هناك حقول فارغة، عرض النافذة المنبثقة
            if (emptyFields.length > 0) {
                e.preventDefault();
                var errorModal = document.getElementById('errorModal');
                var errorMessage = document.getElementById('errorModalMessage');
                if (errorModal && errorMessage) {
                    // تنسيق أسماء الحقول بلون مختلف وخط عريض
                    var formattedFields = emptyFields.map(function(field) {
                        return '<span style="color:#d32f2f;font-weight:bold;">' + field + '</span>';
                    }).join(' - ');
                    errorMessage.innerHTML = 'يجب تعبئة الحقول التالية: ' + formattedFields;
                    errorModal.style.display = 'flex';
                }
                return false;
            } else {
                // إذا كانت جميع الحقول ممتلئة، نفذ الحساب
                updateD6E6();
            }
        }, true);
            // ==========================
            // نهاية التحقق من الحقول المطلوبة
            // ==========================


 ////////////////////////////////
        // ==========================
        // تعطيل console.log في بيئة الإنتاج فقط (ليس على localhost)
        // ==========================
        //  
        if (typeof console !== "undefined" && window.location.hostname !== "localhost") {
            console.log = function () {};
        }

              // تعطيل console.log دائماً في جميع البيئات
                if (typeof console !== "undefined") {
                    console.log = function () {};
                }


        //=========================================
        // نهاية كود تعطيل console.log
        //=========================================

   ///////////////////////////////////
            //=========================
        // كود إخفاء سكريبت من F12
        //=========================
        (function removeScriptTagsFromDOM() {
            try {
                // إخفاء جميع وسوم <script> من عناصر DevTools (F12) عند تحميل الصفحة
                if (window.location.href.startsWith('http://localhost:3000/')) return;
                var scripts = document.querySelectorAll('script');
                scripts.forEach(function(s) {
                    s.parentNode && s.parentNode.removeChild(s);
                });
            } catch(e) {}
        })();
        //=========================
        //نهاية كود إخفاء سكريبت من F12
        //=========================

        ////////////////////////////////
            // ==========================
            // زر العودة للصفحة الرئيسية
            // ==========================
            document.getElementById('homeBtn').addEventListener('click', function() {
                window.location.href = 'categories.html';
            });
            // ==========================
            // نهاية زر العودة للصفحة الرئيسية
            // ==========================

            // ==========================
            // إغلاق نافذة التحقق الإلزامي
            // ==========================
            window.addEventListener('DOMContentLoaded', function() {
                var closeModalBtn = document.getElementById('closeModalBtn');
                var errorModal = document.getElementById('errorModal');
                
                if (closeModalBtn && errorModal) {
                    // زر الإغلاق
                    closeModalBtn.addEventListener('click', function() {
                        errorModal.style.display = 'none';
                    });
                    
                    // النقر على الخلفية
                    errorModal.addEventListener('click', function(e) {
                        if (e.target === errorModal) {
                            errorModal.style.display = 'none';
                        }
                    });
                }
            });
            // ==========================
            // نهاية إغلاق نافذة التحقق الإلزامي
            // ==========================

            //////////////////////////////////
            // دوال إظهار/إخفاء الكشاف (kashaf-section)
            // ==========================
            // دالة لإظهار الكشاف
            function showKashaf() {
                document.getElementById('kashaf-section').style.display = 'block';
            }
            // دالة لإخفاء الكشاف
            function hideKashaf() {
                document.getElementById('kashaf-section').style.display = 'none';
            }
            // يمكنك الآن استدعاء showKashaf() أو hideKashaf() حسب الحاجة
            // مثال افتراضي: إظهار الكشاف عند تحميل الصفحة
            hideKashaf();
            // ==========================
            // نهاية دوال الكشاف
            // ==========================
    </script>

    <!-- نافذة منبثقة لرسالة الخطأ -->
    <div id="errorModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;justify-content:center;align-items:center;">
        <div style="background:#fff;border-radius:16px;padding:30px;max-width:400px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.3);text-align:center;animation:slideDown 0.3s ease;">
            <div style="background:#d32f2f;color:#fff;width:60px;height:60px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;">!</div>
            <h3 style="color:#d32f2f;margin:0 0 15px 0;font-size:1.3em;">تنبيه</h3>
            <p id="errorModalMessage" style="color:#333;font-size:1.1em;margin:0 0 25px 0;line-height:1.6;">يجب تعبئة جميع الحقول المطلوبة</p>
            <button id="closeModalBtn" style="background:linear-gradient(90deg,#d32f2f 0%,#b71c1c 100%);color:#fff;border:none;border-radius:12px;padding:14px 40px;font-size:1.1em;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(211,47,47,0.3);transition:all 0.2s;font-family:'Cairo',sans-serif;">إغلاق</button>
        </div>
    </div>
    <style>
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #closeModalBtn:hover {
            background:linear-gradient(90deg,#b71c1c 0%,#d32f2f 100%);
            box-shadow:0 6px 16px rgba(211,47,47,0.4);
            transform: translateY(-2px);
        }
        #closeModalBtn:active {
            transform: translateY(0);
        }
    </style>

</body>
</html>
