<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعدادات القيم الثابتة</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f7f7f7; text-align: center; padding: 40px; }
        h2 { color: #328cc0; }
        .settings-form {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px #328cc033;
            padding: 28px 20px 18px 20px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #328cc0;
            font-weight: bold;
            font-size: 1em;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #bbb;
            font-size: 1.1em;
            font-family: 'Cairo', sans-serif;
            background: #f7fafd;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #328cc0;
            outline: none;
        }
        .input-with-unit {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-with-unit input {
            padding-left: 40px;
        }
        .input-with-unit::after {
            content: '%';
            position: absolute;
            left: 15px;
            color: #328cc0;
            font-weight: bold;
            font-size: 1.1em;
            pointer-events: none;
        }
        button {
            margin-top: 18px;
            background: linear-gradient(90deg,#00bcd4 0%,#328cc0 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px #328cc033;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        @media (max-width: 600px) {
            .settings-form { max-width: 100vw; border-radius: 0; box-shadow: none; padding: 10px 2px 2px 2px; }
            input { font-size: 1em; padding: 10px; border-radius: 8px; }
            label { font-size: 0.95em; }
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h2>إعدادات القيم الثابتة</h2>
    <form class="settings-form" id="settingsForm">
        <div class="form-row">
            <div class="form-group">
                <label for="slefanBigMatte">سلوفان وجه واحد كبير مطفي</label>
                <input type="number" id="slefanBigMatte" name="slefanBigMatte" step="any" required>
            </div>
            <div class="form-group">
                <label for="slefanBigGlossy">سلوفان وجه واحد كبير لامع</label>
                <input type="number" id="slefanBigGlossy" name="slefanBigGlossy" step="any" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="invoicePercent">نسبة الفواتير</label>
                <div class="input-with-unit">
                    <input type="number" id="invoicePercent" name="invoicePercent" step="any" required>
                </div>
            </div>
            <div class="form-group">
                <label for="letterPercent">نسبة ورق الخطابات</label>
                <div class="input-with-unit">
                    <input type="number" id="letterPercent" name="letterPercent" step="any" required>
                </div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="printPrice">سعر الطباعة</label>
                <input type="number" id="printPrice" name="printPrice" step="any" required>
            </div>
            <div class="form-group">
                <label for="invoicePaperPrice">سعر ورق الفاتورة</label>
                <input type="number" id="invoicePaperPrice" name="invoicePaperPrice" step="any" required>
            </div>
        </div>
        <div class="form-group">
            <label for="vat">ضريبة القيمة المضافة</label>
            <div class="input-with-unit">
                <input type="number" id="vat" name="vat" step="any" required>
            </div>
        </div>
        <button type="submit">حفظ</button>
    <button type="button" style="margin-right:10px;background: linear-gradient(90deg,#328cc0 0%,#4caf50 100%);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:1.1em;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px #328cc033;" onclick="window.location.href='cpanel.html'">رجوع للوحة التحكم</button>
    <button type="button" style="margin-right:10px;background: linear-gradient(90deg,#328cc0 0%,#4caf50 100%);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:1.1em;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px #328cc033;" onclick="window.history.back()">رجوع للصفحة السابقة</button>
    </form>
    <script>
        // جلب القيم من settings.json وعرضها في النموذج
    fetch('/settings.json')
            .then(res => res.json())
            .then(data => {
                if (data) {
                    document.getElementById('slefanBigMatte').value = data.slefanBigMatte || '';
                    document.getElementById('slefanBigGlossy').value = data.slefanBigGlossy || '';
                    document.getElementById('invoicePercent').value = data.invoicePercent || '';
                    document.getElementById('letterPercent').value = data.letterPercent || '';
                    document.getElementById('printPrice').value = data.printPrice || '';
                    document.getElementById('vat').value = data.vat || '';
                    document.getElementById('invoicePaperPrice').value = data.invoicePaperPrice || '';
                }
            });

        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                slefanBigMatte: parseFloat(document.getElementById('slefanBigMatte').value),
                slefanBigGlossy: parseFloat(document.getElementById('slefanBigGlossy').value),
                invoicePercent: parseFloat(document.getElementById('invoicePercent').value),
                letterPercent: parseFloat(document.getElementById('letterPercent').value),
                printPrice: parseFloat(document.getElementById('printPrice').value),
                vat: parseFloat(document.getElementById('vat').value),
                invoicePaperPrice: parseFloat(document.getElementById('invoicePaperPrice').value)
            };
            fetch('/save-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if(result.success){
                    alert('تم حفظ الإعدادات بنجاح');
                }else{
                    alert('حدث خطأ أثناء الحفظ');
                }
            })
            .catch(()=>alert('تعذر الاتصال بالسيرفر'));
        });
    </script>
</body>
</html>
