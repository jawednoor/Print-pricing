<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعدادات النظام</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #f4f8fa; font-family: "Cairo", sans-serif; }
    form { width: min(100%, 760px); margin: auto; padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 10px 34px rgba(50,140,192,.15); }
    h1 { text-align: center; color: #267ca9; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    label { display: block; margin-bottom: 6px; color: #267ca9; font-weight: 700; }
    input { width: 100%; min-height: 48px; padding: 10px; border: 1px solid #b8cbd4; border-radius: 9px; font: inherit; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    button, a { padding: 11px 24px; border: 0; border-radius: 9px; background: #267ca9; color: #fff; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    button { background: #16835e; }
    #message { min-height: 28px; text-align: center; color: #b42318; font-weight: 600; }
    @media (max-width: 650px) { body { padding: 0; } form { min-height: 100vh; border-radius: 0; box-shadow: none; padding: 20px 14px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <form id="settingsForm">
    <h1>إعدادات القيم الثابتة</h1>
    <p id="message">جارٍ تحميل الإعدادات...</p>
    <div class="grid">
      <div><label for="slefanBigMatte">سلوفان كبير مطفي</label><input type="number" step="any" id="slefanBigMatte" required></div>
      <div><label for="slefanBigGlossy">سلوفان كبير لامع</label><input type="number" step="any" id="slefanBigGlossy" required></div>
      <div><label for="invoicePercent">نسبة الفواتير (%)</label><input type="number" step="any" id="invoicePercent" required></div>
      <div><label for="letterPercent">نسبة ورق الخطابات (%)</label><input type="number" step="any" id="letterPercent" required></div>
      <div><label for="printPrice">سعر الطباعة</label><input type="number" step="any" id="printPrice" required></div>
      <div><label for="cuttingPrice">سعر القص</label><input type="number" step="any" id="cuttingPrice" required></div>
      <div><label for="breakingPrice">سعر التكسير</label><input type="number" step="any" id="breakingPrice" required></div>
      <div><label for="pocketWhitePrice">سعر الجيب الأبيض</label><input type="number" step="any" id="pocketWhitePrice" required></div>
      <div><label for="pocketPrintedPrice">سعر الجيب المطبوع</label><input type="number" step="any" id="pocketPrintedPrice" required></div>
      <div><label for="invoicePaperPrice">سعر ورق الفاتورة</label><input type="number" step="any" id="invoicePaperPrice" required></div>
      <div><label for="vat">ضريبة القيمة المضافة (%)</label><input type="number" step="any" id="vat" required></div>
    </div>
    <div class="actions"><button type="submit">حفظ الإعدادات</button><a href="cpanel.html">العودة للوحة التحكم</a></div>
  </form>
  <script>
    const fields = ['slefanBigMatte','slefanBigGlossy','invoicePercent','letterPercent','printPrice','cuttingPrice','breakingPrice','pocketWhitePrice','pocketPrintedPrice','invoicePaperPrice','vat'];
    const message = document.getElementById('message');

    async function loadSettings() {
      try {
        const response = await fetch('server.php?action=settings-display', { credentials: 'same-origin', cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'تعذر تحميل الإعدادات');
        fields.forEach((field) => document.getElementById(field).value = data[field] ?? '');
        message.textContent = '';
      } catch (error) {
        message.textContent = error.message;
        if (error.message.includes('تسجيل الدخول')) window.location.replace('index.html');
      }
    }

    document.getElementById('settingsForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {};
      fields.forEach((field) => payload[field] = Number.parseFloat(document.getElementById(field).value));
      if (Object.values(payload).some((value) => !Number.isFinite(value))) {
        message.textContent = 'تأكد من إدخال جميع القيم بشكل صحيح.';
        return;
      }
      try {
        const response = await fetch('server.php?action=save-settings', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'تعذر الحفظ');
        message.style.color = '#087443'; message.textContent = 'تم حفظ الإعدادات بنجاح.';
      } catch (error) { message.style.color = '#b42318'; message.textContent = error.message; }
    });
    loadSettings();
  </script>
</body>
</html>
