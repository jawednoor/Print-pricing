<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المستخدمين</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; background: linear-gradient(135deg,#328cc0,#00bcd4); font-family: "Cairo", sans-serif; }
    .container { width: min(100%, 760px); margin: auto; padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,44,74,.2); }
    h1 { margin-top: 0; text-align: center; color: #267ca9; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #dce5e9; text-align: center; }
    th { background: #edf7fa; }
    input { width: 100%; min-height: 42px; padding: 8px; border: 1px solid #b8cbd4; border-radius: 8px; font: inherit; text-align: center; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
    button, .link { padding: 10px 20px; border: 0; border-radius: 9px; background: #267ca9; color: #fff; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    .delete { background: #c83b35; padding: 8px 12px; }
    .save { background: #16835e; }
    .message { min-height: 28px; text-align: center; font-weight: 600; color: #b42318; }
    @media (max-width: 650px) { body { padding: 0; background: #fff; } .container { min-height: 100vh; border-radius: 0; padding: 18px 8px; } th, td { padding: 5px; } }
  </style>
</head>
<body>
  <main class="container">
    <h1>إدارة المستخدمين</h1>
    <p id="message" class="message">جارٍ تحميل المستخدمين...</p>
    <table>
      <thead><tr><th>اسم المستخدم</th><th>كلمة مرور جديدة</th><th>حذف</th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
    <div class="actions">
      <button type="button" id="addButton">إضافة مستخدم</button>
      <button type="button" id="saveButton" class="save">حفظ التغييرات</button>
      <a class="link" href="cpanel.html">العودة للوحة التحكم</a>
    </div>
  </main>
  <script>
    let users = [];
    const body = document.getElementById('usersBody');
    const message = document.getElementById('message');

    function render() {
      body.innerHTML = '';
      users.forEach((user, index) => {
        const row = document.createElement('tr');
        const usernameCell = document.createElement('td');
        const passwordCell = document.createElement('td');
        const deleteCell = document.createElement('td');
        const username = document.createElement('input');
        const password = document.createElement('input');
        const remove = document.createElement('button');

        username.value = user.username || '';
        username.disabled = user.username === 'admin';
        username.addEventListener('input', () => users[index].username = username.value.trim());
        password.type = 'password';
        password.placeholder = user.isNew ? '6 خانات على الأقل' : 'اتركها فارغة دون تغيير';
        password.autocomplete = 'new-password';
        password.addEventListener('input', () => users[index].password = password.value);
        remove.type = 'button';
        remove.className = 'delete';
        remove.textContent = 'حذف';
        remove.disabled = user.username === 'admin';
        remove.addEventListener('click', () => { users.splice(index, 1); render(); });

        usernameCell.appendChild(username);
        passwordCell.appendChild(password);
        deleteCell.appendChild(remove);
        row.append(usernameCell, passwordCell, deleteCell);
        body.appendChild(row);
      });
    }

    async function loadUsers() {
      try {
        const response = await fetch('server.php?action=users', { credentials: 'same-origin', cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'تعذر تحميل المستخدمين');
        users = data.map((user) => ({ username: user.username, role: user.role, password: '', isNew: false }));
        message.textContent = '';
        render();
      } catch (error) {
        message.textContent = error.message;
        if (error.message.includes('تسجيل الدخول')) window.location.replace('index.html');
      }
    }

    document.getElementById('addButton').addEventListener('click', () => {
      users.push({ username: '', role: 'user', password: '', isNew: true });
      render();
    });

    document.getElementById('saveButton').addEventListener('click', async () => {
      message.textContent = '';
      const names = users.map((user) => user.username.trim()).filter(Boolean);
      if (names.length !== new Set(names.map((name) => name.toLowerCase())).size) {
        message.textContent = 'أسماء المستخدمين يجب أن تكون غير مكررة.';
        return;
      }
      const invalid = users.find((user) => !user.username.trim() || (user.isNew && user.password.length < 6) || (user.password && user.password.length < 6));
      if (invalid) {
        message.textContent = 'أدخل اسمًا وكلمة مرور لا تقل عن 6 خانات للمستخدم الجديد.';
        return;
      }
      try {
        const response = await fetch('server.php?action=save-users', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(users)
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'تعذر الحفظ');
        message.style.color = '#087443';
        message.textContent = 'تم حفظ المستخدمين بنجاح.';
        await loadUsers();
      } catch (error) {
        message.style.color = '#b42318';
        message.textContent = error.message;
      }
    });

    loadUsers();
  </script>
</body>
</html>
