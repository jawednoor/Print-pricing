<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>تسعير الفواتير</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:linear-gradient(135deg,#328cc0,#00bcd4);font-family:Cairo;color:#183b4d}main{max-width:760px;margin:auto;padding:28px;background:#fff;border-radius:20px}.logo{display:block;max-width:270px;width:70%;margin:auto}h1{text-align:center;color:#267ca9}.grid,.results{display:grid;grid-template-columns:1fr 1fr;gap:16px}label,strong{display:block;color:#267ca9;font-weight:bold}input{width:100%;padding:12px;border:1px solid #b8cbd4;border-radius:9px;font:inherit}.results{margin-top:22px}.result{padding:14px;background:#f1f8fb;border-radius:12px}.total,.total strong{background:#16835e;color:#fff}.back{display:block;margin:22px auto 0;width:max-content;padding:10px 22px;background:#267ca9;color:#fff;text-decoration:none;border-radius:9px}#message{text-align:center;color:#b42318}@media(max-width:620px){body{padding:0;background:#fff}main{min-height:100vh;border-radius:0}.grid,.results{grid-template-columns:1fr}}</style></head><body><main><img class="logo" src="img/logo-albasmahart2.png" alt="الشعار"><h1>تسعير الفواتير</h1><p id="message">جارٍ تحميل الإعدادات...</p><section id="calc" hidden><div class="grid"><div><label>عدد الفواتير</label><input id="qty" type="number" min="1" value="1000"></div><div><label>تكلفة الورقة</label><input id="paper" type="number" min="0" step=".01"></div><div><label>نسبة الربح (%)</label><input id="profit" type="number" min="0" step=".01"></div><div><label>الضريبة (%)</label><input id="vat" type="number" min="0" step=".01"></div></div><div class="results"><div class="result"><strong>تكلفة الورق</strong><span id="cost"></span></div><div class="result"><strong>الربح</strong><span id="gain"></span></div><div class="result"><strong>الضريبة</strong><span id="tax"></span></div><div class="result total"><strong>السعر النهائي</strong><span id="total"></span></div></div><a class="back" href="categories.html">العودة للتصنيفات</a></section></main><script>const $=id=>document.getElementById(id),money=new Intl.NumberFormat('ar-SA',{style:'currency',currency:'SAR'}),num=id=>Math.max(0,parseFloat($(id).value)||0);function calculate(){let c=Math.floor(num('qty'))*num('paper'),g=c*num('profit')/100,b=c+g,t=b*num('vat')/100;$('cost').textContent=money.format(c);$('gain').textContent=money.format(g);$('tax').textContent=money.format(t);$('total').textContent=money.format(b+t)}async function load(){try{let session=await fetch('server.php?action=session',{cache:'no-store'}).then(r=>r.json());if(!session.authenticated)return location.replace('index.html');let r=await fetch('server.php?action=settings',{cache:'no-store'}),s=await r.json();if(!r.ok)throw Error(s.message||'تعذر التحميل');$('paper').value=s.invoicePaperPrice||0;$('profit').value=(s.invoicePercent||0)*100;$('vat').value=(s.vat||0)*100;['qty','paper','profit','vat'].forEach(id=>$(id).oninput=calculate);$('message').hidden=true;$('calc').hidden=false;calculate()}catch(e){$('message').textContent=e.message}}load()</script></body></html>
