<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; background: #f3f8fa; font-family: "Cairo", sans-serif; }
    .panel { width: min(100%, 520px); padding: 30px; border-radius: 18px; background: #fff; box-shadow: 0 12px 40px rgba(50,140,192,.18); text-align: center; }
    h1 { color: #267ca9; margin-top: 0; }
    .status { min-height: 28px; color: #b42318; font-weight: 600; }
    .actions { display: grid; gap: 14px; }
    .button { display: block; width: 100%; padding: 16px; border: 0; border-radius: 12px; background: linear-gradient(90deg,#328cc0,#23a88b); color: #fff; font: inherit; font-size: 1.08rem; font-weight: 700; cursor: pointer; text-decoration: none; }
    .button:hover { filter: brightness(.94); }
    .secondary { margin-top: 18px; background: transparent; color: #267ca9; border: 0; font: inherit; font-weight: 700; cursor: pointer; }
    @media (max-width: 600px) { body { padding: 0; } .panel { min-height: 100vh; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; justify-content: center; } }
  </style>
</head>
<body>
  <main class="panel">
    <h1>لوحة التحكم</h1>
    <p id="status" class="status">جارٍ التحقق من صلاحية المدير...</p>
    <section id="actions" class="actions" hidden>
      <a class="button" href="values.html">إدارة القيم والنسب</a>
      <a class="button" href="users-table.html">إدارة المستخدمين</a>
      <a class="button" href="settings.html">إعدادات النظام</a>
      <a class="button" href="papers.html">إدارة الورق</a>
    </section>
    <button class="secondary" type="button" onclick="window.location.href='categories.html'">العودة إلى التصنيفات</button>
  </main>
  <script>
    async function verifyAdmin() {
      try {
        const response = await fetch('server.php?action=session', { credentials: 'same-origin', cache: 'no-store' });
        const session = await response.json();
        if (!session.authenticated) {
          window.location.replace('index.html');
          return;
        }
        if (session.role !== 'admin') {
          document.getElementById('status').textContent = 'ليس لديك صلاحية الدخول إلى لوحة المدير.';
          return;
        }
        document.getElementById('status').textContent = `مرحبًا ${session.username}`;
        document.getElementById('status').style.color = '#087443';
        document.getElementById('actions').hidden = false;
      } catch (error) {
        document.getElementById('status').textContent = 'تعذر الاتصال بخادم PHP.';
      }
    }
    verifyAdmin();
  </script>
</body>
</html>
