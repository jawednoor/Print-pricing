<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 نظام تشفير/فك تشفير ملف المراجعة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #495057;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 5px;
            font-weight: bold;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
        }
        
        .btn-info {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }
        
        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .alert-success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
        }
        
        .alert-error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }
        
        .alert-info {
            background: #d1ecf1;
            border: 2px solid #bee5eb;
            color: #0c5460;
        }
        
        .stats {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .stats table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .stats td {
            padding: 8px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .stats td:first-child {
            font-weight: bold;
            color: #667eea;
            width: 40%;
        }
        
        .otp-display {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            letter-spacing: 10px;
            margin: 10px 0;
        }
        
        .timer {
            text-align: center;
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 نظام تشفير/فك تشفير ملف المراجعة</h1>
            <p>باستخدام Google Authenticator OTP - مدمج مع server.js</p>
        </div>
        
        <div class="content">
            <!-- قسم توليد OTP -->
            <div class="section">
                <h2>📱 توليد رمز OTP</h2>
                <div id="otp-alert" class="alert"></div>
                <button class="btn btn-info" onclick="generateOTP()">🔑 توليد رمز OTP الحالي</button>
                <div id="otp-result" style="display:none;">
                    <div class="otp-display" id="otp-code">------</div>
                    <div class="timer" id="otp-timer">⏳ صالح لمدة: -- ثانية</div>
                </div>
            </div>
            
            <!-- قسم فك التشفير -->
            <div class="section">
                <h2>🔓 فك تشفير الملف</h2>
                <div id="decrypt-alert" class="alert"></div>
                <div class="input-group">
                    <label for="decrypt-otp">رمز Google Authenticator (6 أرقام):</label>
                    <input type="text" id="decrypt-otp" maxlength="6" placeholder="000000" pattern="[0-9]{6}">
                </div>
                <button class="btn btn-primary" onclick="decryptFile()">🔓 فك التشفير</button>
                <div id="decrypt-stats" class="stats" style="display:none;"></div>
            </div>
            
            <!-- قسم التشفير -->
            <div class="section">
                <h2>🔒 تشفير الملف</h2>
                <div id="encrypt-alert" class="alert"></div>
                <div class="input-group">
                    <label for="encrypt-otp">رمز Google Authenticator (اختياري - سيتم توليده تلقائياً):</label>
                    <input type="text" id="encrypt-otp" maxlength="6" placeholder="000000 (اختياري)" pattern="[0-9]{6}">
                </div>
                <button class="btn btn-success" onclick="encryptFile()">🔒 تشفير الملف</button>
                <div id="encrypt-stats" class="stats" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        // توليد رمز OTP
        async function generateOTP() {
            const alertDiv = document.getElementById('otp-alert');
            const resultDiv = document.getElementById('otp-result');
            const codeDiv = document.getElementById('otp-code');
            const timerDiv = document.getElementById('otp-timer');
            
            try {
                alertDiv.className = 'alert alert-info';
                alertDiv.textContent = '🔄 جاري توليد الرمز...';
                alertDiv.style.display = 'block';
                
                const response = await fetch('/generate-otp');
                const data = await response.json();
                
                if (data.success) {
                    codeDiv.textContent = data.otp;
                    timerDiv.textContent = `⏳ صالح لمدة: ${data.timeRemaining} ثانية`;
                    resultDiv.style.display = 'block';
                    
                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = '✅ تم توليد الرمز بنجاح!';
                    
                    // ملء الحقول تلقائياً
                    document.getElementById('decrypt-otp').value = data.otp;
                    document.getElementById('encrypt-otp').value = data.otp;
                } else {
                    throw new Error(data.message || 'فشل توليد الرمز');
                }
            } catch (error) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = '❌ خطأ: ' + error.message;
                resultDiv.style.display = 'none';
            }
        }
        
        // فك تشفير الملف
        async function decryptFile() {
            const otpCode = document.getElementById('decrypt-otp').value;
            const alertDiv = document.getElementById('decrypt-alert');
            const statsDiv = document.getElementById('decrypt-stats');
            
            if (!otpCode || otpCode.length !== 6) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = '⚠️ يرجى إدخال رمز OTP صحيح (6 أرقام)';
                alertDiv.style.display = 'block';
                return;
            }
            
            try {
                alertDiv.className = 'alert alert-info';
                alertDiv.textContent = '🔄 جاري فك التشفير...';
                alertDiv.style.display = 'block';
                statsDiv.style.display = 'none';
                
                const response = await fetch('/decrypt-doc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otpCode })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = '✅ ' + data.message;
                    
                    // عرض الإحصائيات
                    if (data.stats) {
                        statsDiv.innerHTML = `
                            <table>
                                <tr><td>📄 الملف المفكوك:</td><td>${data.stats.decryptedFile}</td></tr>
                                <tr><td>🔒 الملف المشفر:</td><td>${data.stats.encryptedFile}</td></tr>
                                <tr><td>📏 الحجم المشفر:</td><td>${data.stats.encryptedSize}</td></tr>
                                <tr><td>📏 الحجم الأصلي:</td><td>${data.stats.decryptedSize}</td></tr>
                                <tr><td>🔑 رمز OTP المستخدم:</td><td>${data.stats.otpUsed}</td></tr>
                                <tr><td>🕒 وقت فك التشفير:</td><td>${new Date(data.stats.timestamp).toLocaleString('ar-SA')}</td></tr>
                                ${data.stats.encryptionDate ? `<tr><td>📅 تاريخ التشفير:</td><td>${new Date(data.stats.encryptionDate).toLocaleString('ar-SA')}</td></tr>` : ''}
                            </table>
                        `;
                        statsDiv.style.display = 'block';
                    }
                } else {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = '❌ ' + data.message;
                }
            } catch (error) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = '❌ خطأ: ' + error.message;
            }
        }
        
        // تشفير الملف
        async function encryptFile() {
            const otpCode = document.getElementById('encrypt-otp').value;
            const alertDiv = document.getElementById('encrypt-alert');
            const statsDiv = document.getElementById('encrypt-stats');
            
            try {
                alertDiv.className = 'alert alert-info';
                alertDiv.textContent = otpCode ? '🔄 جاري التشفير بالرمز المُدخل...' : '🔄 جاري التشفير بالرمز التلقائي...';
                alertDiv.style.display = 'block';
                statsDiv.style.display = 'none';
                
                const response = await fetch('/encrypt-doc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otpCode: otpCode || null })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = '✅ ' + data.message;
                    
                    // عرض الإحصائيات
                    if (data.stats) {
                        statsDiv.innerHTML = `
                            <table>
                                <tr><td>🔒 الملف المشفر:</td><td>${data.stats.encryptedFile}</td></tr>
                                <tr><td>📄 الملف الأصلي:</td><td>${data.stats.originalFile}</td></tr>
                                <tr><td>📏 الحجم الأصلي:</td><td>${data.stats.originalSize}</td></tr>
                                <tr><td>📏 الحجم المشفر:</td><td>${data.stats.encryptedSize}</td></tr>
                                <tr><td>🔑 رمز OTP المستخدم:</td><td style="color:#667eea;font-weight:bold;">${data.stats.otpUsed}</td></tr>
                                <tr><td>🕒 وقت التشفير:</td><td>${new Date(data.stats.timestamp).toLocaleString('ar-SA')}</td></tr>
                            </table>
                            <div style="margin-top:15px;padding:10px;background:#fff3cd;border-radius:5px;color:#856404;">
                                ⚠️ احفظ رمز OTP المستخدم: <strong>${data.stats.otpUsed}</strong><br>
                                ستحتاجه لفك التشفير!
                            </div>
                        `;
                        statsDiv.style.display = 'block';
                    }
                } else {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = '❌ ' + data.message;
                }
            } catch (error) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = '❌ خطأ: ' + error.message;
            }
        }
    </script>
</body>
</html>
