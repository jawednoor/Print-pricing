    <script>
        //=========================
        // كود إخفاء سكريبت من F12
        //=========================
        (function removeScriptTagsFromDOM() {
            try {
                // إخفاء جميع وسوم <script> من عناصر DevTools (F12) عند تحميل الصفحة
                if (window.location.href.startsWith('http://localhost:3000/')) return;
                var scripts = document.querySelectorAll('script');
                scripts.forEach(function(s) {
                    s.parentNode && s.parentNode.removeChild(s);
                });
            } catch(e) {}
        })();
        //=========================
        //نهاية كود إخفاء سكريبت من F12
        //=========================

        //=========================================
        document.getElementById('homeBtn').addEventListener('click', function() {
            window.location.href = 'categories.html';
        });



    // تشغيل قاعدة B10 عند النقر على زر إرسال
    // تحديث B10 تلقائياً عند تغيير أي من الحقول المؤثرة
    function addB10AutoUpdateListeners() {
        const fields = [
            'B1','B2','B3','B4','B5','B6','B7','B8',
            'C2','C3','C4','C5','C6','C7','C8','C9','C10'
        ];
        fields.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                if (el.tagName === 'INPUT' || el.tagName === 'SELECT') {
                    el.addEventListener('input', updateB10Kashaf);
                    el.addEventListener('change', updateB10Kashaf);
                } else {
                    el.addEventListener('DOMSubtreeModified', updateB10Kashaf);
                }
            }
        });
    }
    addB10AutoUpdateListeners();
    // يمكن إبقاء زر B10 للطلب اليدوي إذا رغبت بذلك
    // مثال: تحديث جميع حقول كشاف بالتنسيق المطلوب
    // استخدم هذا الكود عند حساب أي قيمة لأي حقل من C5 إلى C11
        // دالة لتحديث جميع حقول كشاف بالتنسيق المطلوب
        function updateKashafField(id, value) {
            // إذا كانت القيمة نصية (رسالة تشخيصية)، اعرضها كما هي بدون تنسيق
            if (typeof value === 'string' && (value.includes('C9=') || isNaN(value))) {
                document.getElementById(id).textContent = value;
            } else {
                if (id === 'C2' || id === 'C3') {
                    document.getElementById(id).textContent = formatNumber(value, 2);
                } else {
                    document.getElementById(id).textContent = formatNumber(value, 3);
                }
            }
        }

        // دالة لحساب قيمة C8 حسب القاعدة المطلوبة
        // دالة لحساب قيمة C10 حسب القاعدة المطلوبة
        // دالة لحساب قيمة C9 حسب القاعدة المطلوبة
        function getC9Value(c10) {
            c10 = parseFloat(c10) || 0;
            if (c10 < 1000) return c10 * 2;
            if (c10 < 5000) return c10 * 1.7;
            if (c10 < 10000) return c10 * 1.5;
            if (c10 < 100000) return c10 * 1.2;
            return "أكبر من 100.000";
        }

        // تحديث قيمة C9 عند تغيير C10
        function updateC9() {
            const c10 = document.getElementById('C10').textContent;
            const c9 = getC9Value(c10);
            updateKashafField('C9', c9);
        }

        document.getElementById('C10').addEventListener('DOMSubtreeModified', updateC9);
        function getC10Value(c8, b8) {
            c8 = parseFloat(c8) || 0;
            b8 = parseFloat(b8) || 0;
            return c8 * b8;
        }

        // تحديث قيمة C10 عند تغيير C8 أو B8
        function updateC10() {
            const c8 = document.getElementById('C8').textContent;
            const b8 = document.getElementById('B8').value;
            const c10 = getC10Value(c8, b8);
            updateKashafField('C10', c10);
            updateC9();
        }

        document.getElementById('C8').addEventListener('DOMSubtreeModified', updateC10);
        document.getElementById('B8').addEventListener('input', updateC10);
        function getC8Value(b1, b6, b7, c4, c5, c6, c7, printPrice) {
            b6 = parseFloat(b6) || 0;
            b7 = parseFloat(b7) || 0;
            c4 = parseFloat(c4) || 0;
            c5 = parseFloat(c5) || 0;
            c6 = parseFloat(c6) || 0;
            c7 = parseFloat(c7) || 0;
            printPrice = parseFloat(printPrice) || 0;
            let base = 0;
            if (b1 === "A3" || b1 === "a3") base = (b6 + b7) * (printPrice * 2);
            else if (b1 === "A4" || b1 === "a4") base = (b6 + b7) * (printPrice * 1);
            else if (b1 === "A5" || b1 === "a5") base = (b6 + b7) * (printPrice / 2);
            else if (b1 === "A6" || b1 === "a6") base = (b6 + b7) * (printPrice / 4);
            return base + (c4 + c5 + c6 + c7);
        }

        // تحديث قيمة C8 عند تغيير B1 أو B6 أو B7 أو القيم البرمجية C4:C7
        function updateC8() {
            const b1 = document.getElementById('B1').value;
            const b6 = document.getElementById('B6').value;
            const b7 = document.getElementById('B7').value;
            const c4 = document.getElementById('C4').textContent;
            const c5 = document.getElementById('C5').textContent;
            const c6 = document.getElementById('C6').textContent;
            const c7 = document.getElementById('C7').textContent;
            fetch('/settings.json')
                .then(res => res.json())
                .then(settings => {
                    const printPrice = settings.printPrice;
                    const c8 = getC8Value(b1, b6, b7, c4, c5, c6, c7, printPrice);
                    updateKashafField('C8', c8);
                });
        }

        document.getElementById('B1').addEventListener('change', updateC8);
        document.getElementById('B6').addEventListener('change', updateC8);
        document.getElementById('B7').addEventListener('change', updateC8);
        document.getElementById('C4').addEventListener('DOMSubtreeModified', updateC8);
        document.getElementById('C5').addEventListener('DOMSubtreeModified', updateC8);
        document.getElementById('C6').addEventListener('DOMSubtreeModified', updateC8);
        document.getElementById('C7').addEventListener('DOMSubtreeModified', updateC8);
        // دالة لحساب قيمة C5 حسب القاعدة المطلوبة
        function getC5Value(b1, b5, b6, settings) {
            let value = 0;
            b6 = parseFloat(b6) || 0;
            if (b5 === "لامع") {
                const slefanBigGlossy = settings.slefanBigGlossy || 0;
                if (b1 === "A3" || b1 === "a3") value = slefanBigGlossy * b6;
                else if (b1 === "A4" || b1 === "a4") value = (slefanBigGlossy / 2) * b6;
                else if (b1 === "A5" || b1 === "a5") value = (slefanBigGlossy / 4) * b6;
                else if (b1 === "A6" || b1 === "a6") value = (slefanBigGlossy / 16) * b6;
            } else if (b5 === "مطفي") {
                const slefanBigMatte = settings.slefanBigMatte || 0;
                if (b1 === "A3" || b1 === "a3") value = slefanBigMatte * b6;
                else if (b1 === "A4" || b1 === "a4") value = (slefanBigMatte / 2) * b6;
                else if (b1 === "A5" || b1 === "a5") value = (slefanBigMatte / 4) * b6;
                else if (b1 === "A6" || b1 === "a6") value = (slefanBigMatte / 16) * b6;
            }
            return value;
        }

        // دالة لحساب قيمة C6 حسب القاعدة المطلوبة
        function getC6Value(b2, c2, b6, papers) {
            b6 = parseFloat(b6) || 0;
            c2 = parseFloat(c2) || 0;
            // VLOOKUP(B2,'papers',4,FALSE) => papers.find(arr => arr[1] === b2)[3]
            // VLOOKUP(B2,'papers',6,FALSE) => papers.find(arr => arr[1] === b2)[5]
            const row = papers.find(arr => arr[1] === b2);
            if (!row) return 0;
            const v1 = parseFloat(row[3]) || 0;
            const v2 = parseFloat(row[5]) || 1;
            return (v1 / v2 / c2) * (b6 / 2);
        }

        // تحديث قيمة C6 عند تغيير B2 أو B6 أو C2
        function updateC6() {
            const b2 = document.getElementById('B2').value;
            const b6 = document.getElementById('B6').value;
            const c2 = document.getElementById('C2').textContent;
            fetch('/papers.json')
                .then(res => res.json())
                .then(data => {
                    const papers = data.papers;
                    const c6 = getC6Value(b2, c2, b6, papers);
                    updateKashafField('C6', c6);
                });
        }

        document.getElementById('B2').addEventListener('change', updateC6);
        document.getElementById('B6').addEventListener('change', updateC6);
        // تحديث C6 عند تغيير C2 (بعد تحديثه)
        document.getElementById('C2').addEventListener('DOMSubtreeModified', updateC6);

        // دالة لحساب قيمة C7 حسب القاعدة المطلوبة
        function getC7Value(b3, c3, papers) {
            // تحويل القيم التي تحتوي رموز غير رقمية (مثل الفاصلة العربية)
                function toNumber(val) {
                    if (typeof val === 'string') {
                        val = val.replace(/٫/g, '.');
                    }
                    let num = parseFloat(val);
                    return isNaN(num) ? 0 : num;
                }
            c3 = toNumber(c3);
            const row = papers.find(arr => arr[1] === b3);
            if (!row) return {value: 0, error: "نوع ورق الغلاف غير صحيح أو غير موجود."};
            const v1 = toNumber(row[3]);
            const v2 = toNumber(row[5]);
            if (!v1 || !v2 || !c3) return {value: 0, error: "تأكد من اختيار نوع ورق الغلاف وقيمة C3 بشكل صحيح."};
            return {value: (v1 / v2 / c3) * 2, error: ""};
        }

        // تحديث قيمة C7 عند تغيير B3 أو C3
        function updateC7() {
            const b3 = document.getElementById('B3').value;
            const c3 = document.getElementById('C3').textContent;
            fetch('/papers.json')
                .then(res => res.json())
                .then(data => {
                    console.log('بيانات papers.json:', data);
                    const papers = data.papers;
                    const errorSpan = document.getElementById('C7-error');
                    if (!Array.isArray(papers) || papers.length === 0) {
                        updateKashafField('C7', 0);
                        errorSpan.textContent = 'لم يتم تحميل بيانات الورق من السيرفر.';
                        errorSpan.style.display = 'inline';
                        return;
                    }
                    const result = getC7Value(b3, c3, papers);
                    updateKashafField('C7', result.value);
                    if (result.error) {
                        errorSpan.textContent = result.error;
                        errorSpan.style.display = 'inline';
                    } else {
                        errorSpan.textContent = '';
                        errorSpan.style.display = 'none';
                    }
                })
                .catch(err => {
                    console.error('خطأ في جلب papers.json:', err);
                    const errorSpan = document.getElementById('C7-error');
                    updateKashafField('C7', 0);
                    errorSpan.textContent = 'تعذر تحميل بيانات الورق من السيرفر.';
                    errorSpan.style.display = 'inline';
                });
        }

        document.getElementById('B3').addEventListener('change', updateC7);
        // تحديث C7 عند تغيير C3 (بعد تحديثه)
        document.getElementById('C3').addEventListener('DOMSubtreeModified', updateC7);

        // تحديث قيمة C5 عند تغيير B1 أو B5 أو B6
        function updateC5() {
            const b1 = document.getElementById('B1').value;
            const b5 = document.getElementById('B5').value;
            const b6 = document.getElementById('B6').value;
            fetch('/settings.json')
                .then(res => res.json())
                .then(settings => {
                    const c5 = getC5Value(b1, b5, b6, settings);
                    updateKashafField('C5', c5);
                });
        }

        document.getElementById('B1').addEventListener('change', updateC5);
        document.getElementById('B5').addEventListener('change', updateC5);
        document.getElementById('B6').addEventListener('change', updateC5);
        // دالة لتنسيق الرقم بثلاث منازل عشرية
        function formatNumber(val) {
            let num = parseFloat(val);
            if (isNaN(num)) return arguments[1] === 2 ? "0.00" : "0.000";
            let digits = arguments[1] || 3;
            return num.toFixed(digits);
        }
                // دالة لحساب قيمة C4 حسب القاعدة المطلوبة
                function getC4Value(b1, b4, settings) {
                        let value = 0;
                        if (b4 === "لامع") {
                            const slefanBigGlossy = settings.slefanBigGlossy || 0;
                            if (b1 === "A3" || b1 === "a3") value = slefanBigGlossy;
                            else if (b1 === "A4" || b1 === "a4") value = slefanBigGlossy / 2;
                            else if (b1 === "A5" || b1 === "a5") value = slefanBigGlossy / 4;
                            else if (b1 === "A6" || b1 === "a6") value = slefanBigGlossy / 8;
                        } else if (b4 === "مطفي") {
                            const slefanBigMatte = settings.slefanBigMatte || 0;
                            if (b1 === "A3" || b1 === "a3") value = slefanBigMatte;
                            else if (b1 === "A4" || b1 === "a4") value = slefanBigMatte / 2;
                            else if (b1 === "A5" || b1 === "a5") value = slefanBigMatte / 4;
                            else if (b1 === "A6" || b1 === "a6") value = slefanBigMatte / 8;
                        }
                        return value;
                }

                // تحديث قيمة C4 عند تغيير B1 أو B4
                function updateC4() {

                // دالة لحساب قيمة C3 حسب القاعدة المطلوبة
                function getC3Value(b1, b3, papers) {
                        const colMap = { "A3": 6, "A4": 7, "A5": 8, "A6": 9 };
                        const col = colMap[b1];
                        if (!col) return 0;
                        const row = papers.find(arr => arr[1] === b3);
                        if (!row) return 0;
                        return row[col] || 0;
                }

                        const col = colMap[b1];
                        if (!col) return 0;
                        const row = papers.find(arr => arr[1] === b2);
                        if (!row) return 0;
                        return row[col] || 0;

        // دالة لحساب قيمة B10 بنفس منطق قاعدة Excel
        function getB10Value(c9, values) {
            c9 = parseFloat(c9) || 0;
            let sorted = values.slice().sort((a, b) => parseFloat(a.value) - parseFloat(b.value));
            let debugValues = sorted.map(v => v.value).join(', ');
            let debugDecimals = sorted.map(v => v.decimal).join(', ');
            for (let i = 0; i < sorted.length; i++) {
                let rowValue = sorted[i]["value"];
                rowValue = parseFloat(rowValue);
                let percentC = sorted[i]["decimal"];
                percentC = parseFloat(percentC);
                if (!isNaN(rowValue) && !isNaN(percentC)) {
                    if (c9 <= rowValue) {
                        return (c9 + (c9 * percentC)).toFixed(3);
                    }
                }
            }
            // إذا لم يجد قيمة مناسبة، أظهر جميع القيم المدخلة
            return `C9=${c9} | values=[${debugValues}] | decimals=[${debugDecimals}]`;
        }

        // دالة لحساب قيمة ب11 حسب القاعدة المطلوبة
        function getB11Value(b10) {
            b10 = parseFloat(b10) || 0;
            return b10 < 50 ? 50 : b10;
        }

        // تحديث قيمة B10 وB11 في الكشاف عند تغيير C9
        function updateB10Kashaf() {
            fetch('/values.json')
                .then(res => res.json())
                .then(values => {
                    const c9Text = document.getElementById('C9').textContent;
                    const errorDiv = document.getElementById('B10-error');
                    errorDiv.textContent = '';
                    let b10Value = 'B10';
                    if (isNaN(parseFloat(c9Text)) || c9Text === 'C9' || c9Text === '') {
                        document.getElementById('B10').textContent = 'B10';
                        errorDiv.textContent = '';
                        document.getElementById('D6').textContent = '-';
                        document.getElementById('E6').textContent = '-';
                    } else {
                        const c9 = parseFloat(c9Text);
                        const b10 = getB10Value(c9, values);
                        // إذا كانت النتيجة رسالة تشخيصية، اعرضها في مربع الخطأ
                        if (typeof b10 === 'string' && b10.startsWith('C9=')) {
                            document.getElementById('B10').textContent = 'B10';
                            errorDiv.textContent = b10;
                            document.getElementById('D6').textContent = '-';
                            document.getElementById('E6').textContent = '-';
                        } else {
                            document.getElementById('B10').textContent = b10;
                            errorDiv.textContent = '';
                            b10Value = b10;
                            // لا يتم حساب D6 وE6 تلقائياً
                        }
                    }
                    // تحديث B11 بناءً على قيمة B10
                    document.getElementById('B11').textContent = getB11Value(b10Value);
                });
        }

        document.getElementById('C9').addEventListener('DOMSubtreeModified', updateB10Kashaf);
        updateB10Kashaf();

                    d6Span.style.transition = 'background 0.5s';
                    setTimeout(() => {
                        d6Span.style.background = '';
                    }, 700);

                    // قاعدة E6: (B11 + (B11 * 0.25)) + ((B11 + (B11 * 0.25)) * vat)
                const b11Value = parseFloat(document.getElementById('B11').textContent) || 0;
                const vatValue = parseFloat(settings.vat) || 0;

                const e6Base = b11Value + (b11Value * 0.20);
                const e6 = e6Base + (e6Base * vatValue);
                document.getElementById('E6').textContent = e6.toFixed(2);
                // حساب D6
                const d6 = b11Value + (b11Value * vatValue);
                document.getElementById('D6').textContent = d6.toFixed(2);
                });
        });

             // التحقق من الحقول المطلوبة عند الضغط على احسب لي
        document.getElementById('calculateBtn').addEventListener('click', function(e) {
            var requiredFields = ['B1','B2','B3','B4','B5','B6'];
            var firstEmpty = null;
            var hasEmpty = false;
            requiredFields.forEach(function(id) {
                var el = document.getElementById(id);
                var val = (el && (el.value !== undefined ? el.value : el.textContent));
                if (!val || val === '' || val === 'اختر' || val === 'اختر نوع الورق ' || val === 'اختر نوع الطباعة' || val === 'اختر عدد الطيات') {
                    hasEmpty = true;
                    if (!firstEmpty) firstEmpty = el;
                    if (el) el.style.borderColor = '#d32f2f';
                } else {
                    if (el) el.style.borderColor = '';
                }
            });
            var errorDiv = document.getElementById('form-error');
            if (hasEmpty) {
                e.preventDefault();
                if (errorDiv) {
                    errorDiv.textContent = 'يجب تعبئة جميع الحقول';
                    errorDiv.style.display = 'block';
                }
                if (firstEmpty) firstEmpty.focus();
                return false;
            } else {
                if (errorDiv) errorDiv.style.display = 'none';
            }
        }, true);
