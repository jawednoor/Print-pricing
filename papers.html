<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول بيانات الورق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f7f7f7; margin: 0; padding: 20px; direction: rtl; font-size: 18px; }
    h1 { text-align: center; font-size: 2em; font-weight: bold; color: #328cc0; margin-bottom: 24px; letter-spacing: 1px; font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
            .table-responsive {
                width: 100vw;
                max-width: 100vw;
                margin-left: -20px;
                margin-right: -20px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                box-shadow: 0 0 0 0 #fff;
                position: relative;
                background: #fff;
            }
        .table-responsive::-webkit-scrollbar {
            height: 8px;
            background: #e0e0e0;
        }
        .table-responsive::-webkit-scrollbar-thumb {
            background: #b0b0b0;
            border-radius: 6px;
        }
        .table-responsive:after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 18px;
            pointer-events: none;
            background: linear-gradient(to left, #f7f7f7 60%, transparent 100%);
            display: block;
        }
    table { border-collapse: collapse; width: 100%; margin: 0; background: #fff; box-shadow: 0 2px 8px #ccc; direction: rtl; font-size: 0.95em; table-layout: fixed; min-width: 900px; }
    th, td { padding: 4px 8px; text-align: center; height: 20px; }
    th:first-child, td:first-child { width: 12%; }
    th:nth-child(2), td:nth-child(2) { width: 60%; }
    th:nth-child(3), td:nth-child(3) { width: 7%; }
    th:nth-child(4), td:nth-child(4) { width: 10%; }
    th:nth-child(5), td:nth-child(5) { width: 22%; }
    th:nth-child(6), td:nth-child(6) { width: 25%; }
    th:nth-child(7), td:nth-child(7) { width: 7%; }
    th:nth-child(8), td:nth-child(8) { width: 7%; }
    th:nth-child(9), td:nth-child(9) { width: 10%; }
    th:nth-child(10), td:nth-child(10) { width: 10%; }
    th:nth-child(11), td:nth-child(11) { width: 10%; }
    th:nth-child(12), td:nth-child(12) { width: 10%; }
    th, td { border: 1px solid #ddd; padding: 14px; text-align: center; }
    select, select option {
        width: 100%;
        padding: 2px 0px;
        font-size: 1em;
        border: 1px solid #bbb;
        border-radius: 4px;
        background: #f9f9f9;
        box-sizing: border-box;
        text-align: center;
        direction: rtl;
    }
    select:focus {
        outline: 1.5px solid #00bcd4;
        background: #e0f7fa;
    }
    th { background: #e3e3e3; font-size: 1em; font-weight: bold; color: #333; letter-spacing: 0.5px; }
    tr:nth-child(even) { background: #f2f2f2; }
    td[contenteditable="true"] { background: #fcfcfc; transition: background 0.2s; font-size: 1em; }
    td[contenteditable="true"]:focus { background: #e0f7fa; outline: 1.5px solid #00bcd4; }
    .add-row-btn { margin: 12px 0; padding: 6px 16px; background: #00bcd4; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    .add-row-btn:hover { background: #0097a7; }
            @media (max-width: 900px) {
                html, body { width: 100vw; min-width: 100vw; max-width: 100vw; overflow-x: hidden; font-size: 15px; padding: 0; margin: 0; background: #f7f7f7; }
                h1 { font-size: 1.2em; }
                .table-responsive { width: 100vw; max-width: 100vw; margin: 0; padding: 0; left: 0; right: 0; }
                table { font-size: 0.85em; min-width: 600px; }
                th, td { padding: 6px 2px; }
                .add-row-btn, #download-template, #import-excel, #send-data { font-size: 0.95em; padding: 6px 8px; }
            }
            @media (max-width: 600px) {
                html, body { width: 100vw; min-width: 100vw; max-width: 100vw; overflow-x: hidden; font-size: 13px; padding: 0; margin: 0; background: #f7f7f7; }
                h1 { font-size: 1em; }
                .table-responsive { width: 100vw; max-width: 100vw; margin: 0; padding: 0; left: 0; right: 0; }
                table { font-size: 0.75em; min-width: 400px; }
                th, td { padding: 4px 1px; }
                .add-row-btn, #download-template, #import-excel, #send-data { font-size: 0.85em; padding: 4px 4px; }
            }
    </style>
</head>
<body>
            <h1 style="margin-bottom: 10px;">جدول بيانات الورق</h1>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;">
                <button class="add-row-btn" style="font-size:1.1em; padding:5px 16px;" onclick="addRow()">إضافة صف جديد</button>
                <button id="download-template" style="font-size:1em; padding:6px 12px; background:#4caf50; color:#fff; border:none; border-radius:4px; cursor:pointer;">تحميل قالب إكسل</button>
                <input type="file" id="excel-file" accept=".xlsx,.xls" style="font-size:1em;" />
                <button id="import-excel" style="font-size:1em; padding:6px 12px; background:#2196f3; color:#fff; border:none; border-radius:4px; cursor:pointer;">استيراد بيانات من إكسل</button>
                <button id="send-data" style="font-size:1em; padding:6px 12px; background:#ff9800; color:#fff; border:none; border-radius:4px; cursor:pointer;">إرسال البيانات</button>
                <button class="add-row-btn" style="background:linear-gradient(90deg,#328cc0 0%,#4caf50 100%);margin-right:8px;" onclick="window.history.back()">رجوع للصفحة السابقة</button>
            </div>
            <div class="table-responsive">
                <table id="sheetTable">
        <thead>
            <tr>
                <th>النوع</th> <!-- عمود جديد: النوع -->
                <th>اسم الورق</th> <!-- عمود 2: اسم الورق -->
                <th>التوفر</th>
                <th>السعر</th>
                <th>المقاس</th>
                <th>عدد الورق لكل رزمة</th>
                <th>A3</th>
                <th>A4</th>
                <th>A5</th>
                <th>A6</th>
                <th>A7</th>
                <th>الكرت</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <select id="type-select" style="font-size:0.8em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width:100%;">
                        <option value="ورق">ورق</option>
                        <option value="ظرف">ظرف</option>
                    </select>
                </td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td style="text-align:center;">
                    <label style="display:flex; align-items:center; justify-content:center; gap:8px;">
                        <input type="checkbox" style="width:28px; height:28px; accent-color:#2ac2b3;">
                    </label>
                </td>
                <td contenteditable="true" style="font-size:1.2em; color:#797575; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td>
                    <select id="paper-size-select" style="font-size:0.9em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                        <option value="70X100">70X100</option>
                        <option value="64X90">64X90</option>
                        <option value="60X70">60X70</option>
                        <option value="50X35">50X35</option>
                        <option value="25X35">25X35</option>
                        <option value="17.5X25">17.5X25</option>
                        <option value="11X22">11X22</option>
                    </select>
                </td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
                <td contenteditable="true" style="font-size:1.2em; color:#585858; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></td>
            </tr>
                </tbody>
            </table>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
    // التحقق من تسجيل الدخول
    if (localStorage.getItem('loggedIn') !== 'true') {
        window.location.href = 'cpanel.html';
    }
    
    // دالة تعبئة الجدول من بيانات JSON
    function fillTableFromJson(data) {
        const tbody = document.getElementById('sheetTable').getElementsByTagName('tbody')[0];
        tbody.innerHTML = '';
        if (!data || !Array.isArray(data.papers)) return;
        data.papers.forEach(row => {
            const tr = document.createElement('tr');
            // النوع
            let typeCell = document.createElement('td');
            typeCell.innerHTML = `<select style="font-size:0.8em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width:100%;">
                <option value="ورق">ورق</option>
                <option value="ظرف">ظرف</option>
            </select>`;
            if (row[0]) typeCell.querySelector('select').value = row[0];
            tr.appendChild(typeCell);
            // اسم الورق
            let nameCell = document.createElement('td');
            nameCell.contentEditable = "true";
            nameCell.style.fontSize = "1.2em";
            nameCell.style.color = "#585858";
            nameCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            nameCell.textContent = row[1] || '';
            tr.appendChild(nameCell);
            // التوفر
            let availCell = document.createElement('td');
            availCell.style.textAlign = "center";
            availCell.innerHTML = `<label style="display:flex; align-items:center; justify-content:center; gap:8px;"><input type='checkbox' style='width:28px; height:28px; accent-color:#2ac2b3;'></label>`;
            let checkbox = availCell.querySelector('input[type="checkbox"]');
            if (row[2] === true || row[2] === 'نعم' || row[2] === 'true') {
                checkbox.checked = true;
            } else {
                checkbox.checked = false;
            }
            tr.appendChild(availCell);
            // السعر
            let priceCell = document.createElement('td');
            priceCell.contentEditable = "true";
            priceCell.style.fontSize = "1.2em";
            priceCell.style.color = "#797575";
            priceCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            priceCell.textContent = row[3] || '';
            tr.appendChild(priceCell);
            // المقاس
            let sizeCell = document.createElement('td');
            sizeCell.innerHTML = `<select style="font-size:0.9em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                <option value="70X100">70X100</option>
                <option value="64X90">64X90</option>
                <option value="60X70">60X70</option>
                <option value="50X35">50X35</option>
                <option value="25X35">25X35</option>
                <option value="17.5X25">17.5X25</option>
                <option value="11X22">11X22</option>
            </select>`;
            if (row[4]) sizeCell.querySelector('select').value = row[4];
            tr.appendChild(sizeCell);
            // عدد الورق لكل رزمة
            let countCell = document.createElement('td');
            countCell.contentEditable = "true";
            countCell.style.fontSize = "1.2em";
            countCell.style.color = "#585858";
            countCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            countCell.textContent = row[5] || '';
            tr.appendChild(countCell);
            // الأعمدة البرمجية (A3-A7 والكرت)
            for (let k = 6; k < 12; k++) {
                let cell = document.createElement('td');
                cell.contentEditable = "true";
                cell.style.fontSize = "1.2em";
                cell.style.color = "#585858";
                cell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
                cell.textContent = row[k] || '';
                tr.appendChild(cell);
            }
            // تفعيل القواعد البرمجية للمقاس و A3-A7
            let sizeSelect = tr.cells[4].querySelector('select');
            let a3Cell = tr.cells[6];
            let a4Cell = tr.cells[7];
            let a5Cell = tr.cells[8];
            let a6Cell = tr.cells[9];
            let a7Cell = tr.cells[10];
            function updateRowAutoColumns() {
                // قاعدة A3 حسب المقاس
                if (sizeSelect.value === '70X100') {
                    a3Cell.textContent = '4';
                } else if (sizeSelect.value === '64X90' || sizeSelect.value === '60X70') {
                    a3Cell.textContent = '2';
                } else if (sizeSelect.value === '50X35') {
                    a3Cell.textContent = '1';
                } else if (sizeSelect.value === '25X35' || sizeSelect.value === '17.5X25' || sizeSelect.value === '11X22') {
                    a3Cell.textContent = '0';
                } else {
                    a3Cell.textContent = '';
                }
                // حساب الأعمدة التالية
                let a3 = parseInt(a3Cell.textContent.trim()) || 0;
                a4Cell.textContent = a3 * 2;
                let a4 = parseInt(a4Cell.textContent.trim()) || 0;
                a5Cell.textContent = a4 * 2;
                let a5 = parseInt(a5Cell.textContent.trim()) || 0;
                a6Cell.textContent = a5 * 2;
                let a6 = parseInt(a6Cell.textContent.trim()) || 0;
                a7Cell.textContent = a6 * 2;
            }
            sizeSelect.addEventListener('change', updateRowAutoColumns);
            a3Cell.addEventListener('input', updateRowAutoColumns);
            // تفعيل القاعدة مباشرة بعد الإنشاء
            updateRowAutoColumns();
            tbody.appendChild(tr);
        });
    }
        // دالة لتحديث الأعمدة تلقائياً بناءً على القيم
    function updateAutoColumns() {
        var tr = document.querySelector('#sheetTable tbody tr');
        if (!tr) return;
        var a3Cell = tr.cells[6];
        var a4Cell = tr.cells[7];
        var a5Cell = tr.cells[8];
        var a6Cell = tr.cells[9];
        var a7Cell = tr.cells[10];
        // A3
        var a3 = parseInt(a3Cell.textContent.trim()) || 0;
        // A4
        a4Cell.textContent = a3 * 2;
        // A5
        var a4 = parseInt(a4Cell.textContent.trim()) || 0;
        a5Cell.textContent = a4 * 2;
        // A6
        var a5 = parseInt(a5Cell.textContent.trim()) || 0;
        a6Cell.textContent = a5 * 2;
        // A7
        var a6 = parseInt(a6Cell.textContent.trim()) || 0;
        a7Cell.textContent = a6 * 2;
    }

    document.addEventListener('DOMContentLoaded', function() {
        // جلب البيانات من المسار المناسب تلقائياً
    var papersPath = '/papers.json';
        fetch(papersPath)
            .then(res => res.json())
            .then(data => {
                fillTableFromJson(data);
            })
            .catch(err => {
                console.warn('لم يتم العثور على بيانات محفوظة أو حدث خطأ في الجلب:', err);
            });
        var select = document.getElementById('paper-size-select');
        if (select) {
            select.addEventListener('change', function() {
                var tr = select.closest('tr');
                var a3Cell = tr ? tr.cells[6] : null;
                if (a3Cell) {
                    if (select.value === '70X100') {
                        a3Cell.textContent = '4';
                    } else if (select.value === '64X90' || select.value === '60X70') {
                        a3Cell.textContent = '2';
                    } else if (select.value === '50X35') {
                        a3Cell.textContent = '1';
                    } else if (select.value === '25X35' || select.value === '17.5X25' || select.value === '11X22') {
                        a3Cell.textContent = '0';
                    } else {
                        a3Cell.textContent = '';
                    }
                    updateAutoColumns();
                }
            });
        }
        // تحديث الأعمدة تلقائياً عند تغيير قيمة A3 يدوياً
        var sheetTable = document.getElementById('sheetTable');
        if (sheetTable) {
            var tr = sheetTable.tBodies[0].rows[0];
            if (tr) {
                var a3Cell = tr.cells[6];
                a3Cell.addEventListener('input', updateAutoColumns);
            }
        }
    });
        // زر تحميل قالب إكسل
        document.getElementById('download-template').onclick = function() {
            const wb = XLSX.utils.book_new();
            const ws_data = [
                ["النوع","اسم الورق","التوفر","السعر","المقاس","عدد الورق لكل رزمة"],
                ["(ورق/ظرف)","مثال","نعم/لا","100","70X100/64X90/60X70/50X35/25X35/17.5X25/11X22","500"]
            ];
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            XLSX.utils.book_append_sheet(wb, ws, "الورق");
            XLSX.writeFile(wb, "template.xlsx");
        };

        // استيراد بيانات من ملف إكسل
        document.getElementById('import-excel').onclick = function() {
            const fileInput = document.getElementById('excel-file');
            if (!fileInput.files.length) {
                alert('يرجى اختيار ملف إكسل أولاً');
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, {header:1});
                const tbody = document.getElementById('sheetTable').getElementsByTagName('tbody')[0];
                tbody.innerHTML = '';
                // توقع الأعمدة: النوع، اسم الورق، التوفر، السعر، المقاس، عدد الورق لكل رزمة
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    const tr = document.createElement('tr');
                    // النوع
                    let typeCell = document.createElement('td');
                    typeCell.innerHTML = `<select style="font-size:0.8em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width:100%;">
                        <option value="ورق">ورق</option>
                        <option value="ظرف">ظرف</option>
                    </select>`;
                    if (row[0]) typeCell.querySelector('select').value = row[0];
                    tr.appendChild(typeCell);
                    // اسم الورق
                    let nameCell = document.createElement('td');
                    nameCell.contentEditable = "true";
                    nameCell.style.fontSize = "1.2em";
                    nameCell.style.color = "#585858";
                    nameCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
                    nameCell.textContent = row[1] || '';
                    tr.appendChild(nameCell);
                    // التوفر
                    let availCell = document.createElement('td');
                    availCell.style.textAlign = "center";
                    availCell.innerHTML = `<label style="display:flex; align-items:center; justify-content:center; gap:8px;"><input type='checkbox' style='width:28px; height:28px; accent-color:#2ac2b3;'></label>`;
                    let checkbox = availCell.querySelector('input[type="checkbox"]');
                    if (row[2] && (row[2].toString().trim() === 'نعم' || row[2].toString().trim().toLowerCase() === 'true')) {
                        checkbox.checked = true;
                    } else {
                        checkbox.checked = false;
                    }
                    tr.appendChild(availCell);
                    // السعر
                    let priceCell = document.createElement('td');
                    priceCell.contentEditable = "true";
                    priceCell.style.fontSize = "1.2em";
                    priceCell.style.color = "#797575";
                    priceCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
                    priceCell.textContent = row[3] || '';
                    tr.appendChild(priceCell);
                    // المقاس
                    let sizeCell = document.createElement('td');
                    sizeCell.innerHTML = `<select style="font-size:0.9em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                        <option value="70X100">70X100</option>
                        <option value="64X90">64X90</option>
                        <option value="60X70">60X70</option>
                        <option value="50X35">50X35</option>
                        <option value="25X35">25X35</option>
                        <option value="17.5X25">17.5X25</option>
                        <option value="11X22">11X22</option>
                    </select>`;
                    if (row[4]) sizeCell.querySelector('select').value = row[4];
                    tr.appendChild(sizeCell);
                    // عدد الورق لكل رزمة
                    let countCell = document.createElement('td');
                    countCell.contentEditable = "true";
                    countCell.style.fontSize = "1.2em";
                    countCell.style.color = "#585858";
                    countCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
                    countCell.textContent = row[5] || '';
                    tr.appendChild(countCell);
                    // الأعمدة البرمجية (A3-A7 والكرت)
                    for (let k = 0; k < 6; k++) {
                        let cell = document.createElement('td');
                        cell.contentEditable = "true";
                        cell.style.fontSize = "1.2em";
                        cell.style.color = "#585858";
                        cell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
                        cell.textContent = '';
                        tr.appendChild(cell);
                    }
                    // تفعيل القواعد البرمجية للمقاس و A3-A7
                    let sizeSelect = tr.cells[4].querySelector('select');
                    let a3Cell = tr.cells[6];
                    let a4Cell = tr.cells[7];
                    let a5Cell = tr.cells[8];
                    let a6Cell = tr.cells[9];
                    let a7Cell = tr.cells[10];
                    function updateRowAutoColumns() {
                        // قاعدة A3 حسب المقاس
                        if (sizeSelect.value === '70X100') {
                            a3Cell.textContent = '4';
                        } else if (sizeSelect.value === '64X90' || sizeSelect.value === '60X70') {
                            a3Cell.textContent = '2';
                        } else if (sizeSelect.value === '50X35') {
                            a3Cell.textContent = '1';
                        } else if (sizeSelect.value === '25X35' || sizeSelect.value === '17.5X25' || sizeSelect.value === '11X22') {
                            a3Cell.textContent = '0';
                        } else {
                            a3Cell.textContent = '';
                        }
                        // حساب الأعمدة التالية
                        let a3 = parseInt(a3Cell.textContent.trim()) || 0;
                        a4Cell.textContent = a3 * 2;
                        let a4 = parseInt(a4Cell.textContent.trim()) || 0;
                        a5Cell.textContent = a4 * 2;
                        let a5 = parseInt(a5Cell.textContent.trim()) || 0;
                        a6Cell.textContent = a5 * 2;
                        let a6 = parseInt(a6Cell.textContent.trim()) || 0;
                        a7Cell.textContent = a6 * 2;
                    }
                    sizeSelect.addEventListener('change', updateRowAutoColumns);
                    a3Cell.addEventListener('input', updateRowAutoColumns);
                    // تفعيل القاعدة مباشرة بعد الإنشاء
                    updateRowAutoColumns();
                    tbody.appendChild(tr);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // زر إرسال البيانات
        document.getElementById('send-data').onclick = function() {
            const rows = [];
            const tbody = document.getElementById('sheetTable').getElementsByTagName('tbody')[0];
            for (const tr of tbody.rows) {
                const row = [];
                for (let i = 0; i < tr.cells.length; i++) {
                    if (i === 0) { // النوع (select)
                        const select = tr.cells[i].querySelector('select');
                        row.push(select ? select.value : '');
                    } else if (i === 2) { // التوفر (checkbox)
                        const checkbox = tr.cells[i].querySelector('input[type="checkbox"]');
                        row.push(checkbox && checkbox.checked ? true : false);
                    } else if (i === 4) { // المقاس (select)
                        const select = tr.cells[i].querySelector('select');
                        row.push(select ? select.value : '');
                    } else {
                        row.push(tr.cells[i].textContent.trim());
                    }
                }
                rows.push(row);
            }
            // إرسال البيانات إلى الخادم
            fetch('/save-papers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ papers: rows })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message || 'تم إرسال البيانات بنجاح');
            })
            .catch(err => {
                alert('حدث خطأ أثناء الإرسال: ' + (err.message || err));
                console.error('تفاصيل الخطأ:', err);
            });
        };

        function addRow() {
            const table = document.getElementById('sheetTable').getElementsByTagName('tbody')[0];
            const newRow = document.createElement('tr');
            // النوع
            let typeCell = document.createElement('td');
            typeCell.innerHTML = `<select style="font-size:0.8em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width:100%;">
                <option value="ورق">ورق</option>
                <option value="ظرف">ظرف</option>
            </select>`;
            newRow.appendChild(typeCell);
            // اسم الورق
            let nameCell = document.createElement('td');
            nameCell.contentEditable = "true";
            nameCell.style.fontSize = "1.2em";
            nameCell.style.color = "#585858";
            nameCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            newRow.appendChild(nameCell);
            // التوفر
            let availCell = document.createElement('td');
            availCell.style.textAlign = "center";
            availCell.innerHTML = `<label style="display:flex; align-items:center; justify-content:center; gap:8px;"><input type='checkbox' style='width:28px; height:28px; accent-color:#2ac2b3;'></label>`;
            newRow.appendChild(availCell);
            // السعر
            let priceCell = document.createElement('td');
            priceCell.contentEditable = "true";
            priceCell.style.fontSize = "1.2em";
            priceCell.style.color = "#797575";
            priceCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            newRow.appendChild(priceCell);
            // المقاس
            let sizeCell = document.createElement('td');
            sizeCell.innerHTML = `<select style="font-size:0.9em; color:#464444; font-family:'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                <option value="70X100">70X100</option>
                <option value="64X90">64X90</option>
                <option value="60X70">60X70</option>
                <option value="50X35">50X35</option>
                <option value="25X35">25X35</option>
                <option value="17.5X25">17.5X25</option>
                <option value="11X22">11X22</option>
            </select>`;
            newRow.appendChild(sizeCell);
            // عدد الورق لكل رزمة
            let countCell = document.createElement('td');
            countCell.contentEditable = "true";
            countCell.style.fontSize = "1.2em";
            countCell.style.color = "#585858";
            countCell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            newRow.appendChild(countCell);
            // الأعمدة البرمجية (A3-A7 والكرت)
            for (let i = 0; i < 6; i++) {
                let cell = document.createElement('td');
                cell.contentEditable = "true";
                cell.style.fontSize = "1.2em";
                cell.style.color = "#585858";
                cell.style.fontFamily = "'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
                newRow.appendChild(cell);
            }
            table.appendChild(newRow);
        }
    </script>
