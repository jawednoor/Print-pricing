<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة القيم والنسب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; background: #f5f8fa; font-family: "Cairo", sans-serif; }
    main { width: min(100%, 900px); margin: auto; }
    h1 { text-align: center; color: #267ca9; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
    button, .link, input { padding: 10px 15px; border-radius: 8px; font: inherit; }
    button, .link { border: 0; background: #267ca9; color: #fff; font-weight: 700; cursor: pointer; text-decoration: none; }
    .save { background: #16835e; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    th, td { border: 1px solid #dbe4e8; padding: 10px; text-align: center; }
    th { background: #eaf5f8; }
    td[contenteditable="true"]:focus { outline: 2px solid #00bcd4; background: #f1fcff; }
    .message { min-height: 28px; text-align: center; color: #b42318; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>جدول القيم والنسب</h1>
    <p id="message" class="message">جارٍ تحميل البيانات...</p>
    <div class="toolbar">
      <input id="increase" type="number" step="0.01" placeholder="نسبة الزيادة">
      <button type="button" id="increaseButton">زيادة جميع النسب</button>
      <button type="button" id="addButton">إضافة صف</button>
      <button type="button" id="saveButton" class="save">حفظ البيانات</button>
      <a class="link" href="cpanel.html">العودة للوحة التحكم</a>
    </div>
    <table>
      <thead><tr><th>القيمة</th><th>النسبة المئوية</th><th>حذف</th></tr></thead>
      <tbody id="valuesBody"></tbody>
    </table>
  </main>
  <script>
    let rows = [];
    const body = document.getElementById('valuesBody');
    const message = document.getElementById('message');

    function numberFrom(value) {
      const normalized = String(value).replace('%', '').replace('٫', '.').replace(',', '.').trim();
      const number = Number.parseFloat(normalized);
      return Number.isFinite(number) ? number : 0;
    }

    function render() {
      body.innerHTML = '';
      rows.forEach((item, index) => {
        const row = document.createElement('tr');
        const value = document.createElement('td');
        const percent = document.createElement('td');
        const action = document.createElement('td');
        const remove = document.createElement('button');
        value.contentEditable = 'true';
        percent.contentEditable = 'true';
        value.textContent = item.value;
        percent.textContent = `${numberFrom(item.percent)}%`;
        value.addEventListener('input', () => rows[index].value = value.textContent.trim());
        percent.addEventListener('input', () => rows[index].percent = percent.textContent.trim());
        remove.type = 'button'; remove.textContent = 'حذف'; remove.style.background = '#c83b35';
        remove.addEventListener('click', () => { rows.splice(index, 1); render(); });
        action.appendChild(remove); row.append(value, percent, action); body.appendChild(row);
      });
    }

    async function ensureAdmin() {
      const response = await fetch('server.php?action=session', { credentials: 'same-origin', cache: 'no-store' });
      const session = await response.json();
      if (!session.authenticated) { window.location.replace('index.html'); return false; }
      if (session.role !== 'admin') { message.textContent = 'هذه الصفحة متاحة للمدير فقط.'; return false; }
      return true;
    }

    async function load() {
      try {
        if (!await ensureAdmin()) return;
        const response = await fetch('server.php?action=values.json', { credentials: 'same-origin', cache: 'no-store' });
        rows = await response.json();
        if (!Array.isArray(rows)) rows = [];
        message.textContent = '';
        render();
      } catch (error) { message.textContent = 'تعذر تحميل القيم من خادم PHP.'; }
    }

    document.getElementById('addButton').addEventListener('click', () => { rows.push({ value: '', percent: '0%' }); render(); });
    document.getElementById('increaseButton').addEventListener('click', () => {
      const increase = numberFrom(document.getElementById('increase').value);
      rows = rows.map((row) => ({ ...row, percent: `${numberFrom(row.percent) + increase}%` })); render();
    });
    document.getElementById('saveButton').addEventListener('click', async () => {
      const payload = rows.filter((row) => String(row.value).trim() !== '').map((row) => ({ value: numberFrom(row.value), percent: `${numberFrom(row.percent)}%` }));
      try {
        const response = await fetch('server.php?action=values.json', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'تعذر الحفظ');
        message.style.color = '#087443'; message.textContent = 'تم حفظ القيم بنجاح.'; rows = payload; render();
      } catch (error) { message.style.color = '#b42318'; message.textContent = error.message; }
    });
    load();
  </script>
</body>
</html>
