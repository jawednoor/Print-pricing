<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مراقب السيرفر النشط - خدمة الخلفية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #328cc0 0%, #00bcd4 100%); 
            font-family: 'Cairo', sans-serif; 
            text-align: center; 
            padding: 40px; 
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(50, 140, 192, 0.3);
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #328cc0;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        .status-section {
            margin: 30px 0;
        }

        .status {
            font-size: 1.6em;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .success { 
            background: #e8f5e8; 
            color: #4caf50; 
            border: 2px solid #4caf50;
        }
        .fail { 
            background: #ffeaea; 
            color: #ec3333; 
            border: 2px solid #ec3333;
        }
        .checking {
            background: #fff3e0;
            color: #ff9800;
            border: 2px solid #ff9800;
        }
        .background-active {
            background: #e3f2fd;
            color: #1976d2;
            border: 2px solid #1976d2;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #328cc0;
        }
        .info-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        .info-value {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            font-size: 1em;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
        }

        .btn-check {
            background: linear-gradient(90deg,#00bcd4 0%,#328cc0 100%);
        }

        .btn-auto {
            background: linear-gradient(90deg,#4caf50 0%,#66bb6a 100%);
        }

        .btn-stop {
            background: linear-gradient(90deg,#f44336 0%,#ef5350 100%);
        }

        .btn-background {
            background: linear-gradient(90deg,#9c27b0 0%,#673ab7 100%);
        }

        .btn-background.active {
            background: linear-gradient(90deg,#ff9800 0%,#f57c00 100%);
        }

        .btn-home {
            background: linear-gradient(90deg,#607d8b 0%,#455a64 100%);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .logs {
            background: #263238;
            color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            direction: ltr;
        }

        .log-background { 
            color: #9c27b0; 
        }

        .log-success { 
            color: #4caf50; 
        }

        .log-error { 
            color: #f44336; 
        }

        .log-info { 
            color: #2196f3; 
        }

        .log-warning { 
            color: #ff9800; 
        }

        .background-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(156, 39, 176, 0.9);
            color: #fff;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            display: none;
            z-index: 1000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: #4caf50;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            z-index: 1001;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 25px 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
            button {
                width: 90%;
                max-width: 300px;
                margin: 5px 0;
            }
            .background-indicator {
                top: 10px;
                right: 10px;
                font-size: 0.8em;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="background-indicator" id="backgroundIndicator">
        🌙 يعمل في الخلفية
    </div>
    
    <div class="notification" id="notification">
        تم تفعيل وضع الخلفية بنجاح!
    </div>
    
    <div class="container">
        <h1>🚀 مراقب السيرفر المتقدم</h1>
        
        <div class="status-section">
            <div id="status" class="status checking">جاري الفحص...</div>
        </div>
        
        <div class="info-grid">
            <div class="info-box">
                <div class="info-label">آخر فحص</div>
                <div class="info-value" id="lastCheck">-</div>
            </div>
            <div class="info-box">
                <div class="info-label">وقت الاستجابة</div>
                <div class="info-value" id="responseTime">-</div>
            </div>
            <div class="info-box">
                <div class="info-label">حالة المراقبة</div>
                <div class="info-value" id="monitorStatus">متوقف</div>
            </div>
            <div class="info-box">
                <div class="info-label">عدد الفحوصات</div>
                <div class="info-value" id="checkCount">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">وضع الخلفية</div>
                <div class="info-value" id="backgroundStatus">غير نشط</div>
            </div>
            <div class="info-box">
                <div class="info-label">وقت التشغيل</div>
                <div class="info-value" id="uptime">00:00:00</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-check" onclick="checkServer()">فحص فوري</button>
            <button class="btn-auto" onclick="startAutoCheck()" id="autoBtn">بدء المراقبة</button>
            <button class="btn-stop" onclick="stopAutoCheck()" style="display:none;" id="stopBtn">إيقاف المراقبة</button>
            <button class="btn-background" onclick="toggleBackgroundMode()" id="backgroundBtn">🌙 وضع الخلفية</button>
            <button class="btn-home" onclick="location.href='index.html'">الصفحة الرئيسية</button>
        </div>
        
        <div class="logs" id="logContainer">
            <div class="log-entry log-info">[INFO] مراقب السيرفر المتقدم جاهز...</div>
        </div>
    </div>

    <script>
        // المتغيرات العامة
        let autoCheckInterval = null;
        let isAutoChecking = false;
        let checkCount = 0;
        let isBackgroundMode = false;
        let wakeLock = null;
        let startTime = Date.now();
        let uptimeInterval = null;

        const SERVER_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

        // العناصر
        const statusDiv = document.getElementById('status');
        const lastCheckDiv = document.getElementById('lastCheck');
        const responseTimeDiv = document.getElementById('responseTime');
        const monitorStatusDiv = document.getElementById('monitorStatus');
        const checkCountDiv = document.getElementById('checkCount');
        const backgroundStatusDiv = document.getElementById('backgroundStatus');
        const uptimeDiv = document.getElementById('uptime');
        const logContainer = document.getElementById('logContainer');
        const autoBtn = document.getElementById('autoBtn');
        const stopBtn = document.getElementById('stopBtn');
        const backgroundBtn = document.getElementById('backgroundBtn');
        const backgroundIndicator = document.getElementById('backgroundIndicator');
        const notification = document.getElementById('notification');

        // دالة إضافة سجل
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(logEntry);

            // الحفاظ على آخر 50 سجل
            if (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
            logContainer.scrollTop = logContainer.scrollHeight;

            // حفظ في localStorage للوضع الخلفي
            if (isBackgroundMode) {
                const logs = JSON.parse(localStorage.getItem('backgroundLogs') || '[]');
                logs.push({timestamp, message, type});
                if (logs.length > 100) logs.shift();
                localStorage.setItem('backgroundLogs', JSON.stringify(logs));
            }
        }

        // دالة تحديث وقت التشغيل
        function updateUptime() {
            const now = Date.now();
            const elapsed = now - startTime;
            const hours = Math.floor(elapsed / (1000 * 60 * 60));
            const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);
            uptimeDiv.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // دالة فحص السيرفر
        async function checkServer() {
            const checkStartTime = Date.now();
            statusDiv.textContent = 'جاري الفحص...';
            statusDiv.className = isBackgroundMode ? 'status background-active' : 'status checking';
            
            try {
                addLog('بدء فحص السيرفر...', 'info');
                        
                // محاولة الوصول لـ ping endpoint
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                
                const response = await fetch(`${SERVER_BASE}/ping`, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    },
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const checkEndTime = Date.now();
                const responseTime = checkEndTime - checkStartTime;
                
                if (response.ok) {
                    // تحديث الواجهة - حالة نجح
                    statusDiv.textContent = isBackgroundMode ? '🌙 يعمل في الخلفية - السيرفر متصل' : '✅ السيرفر يعمل بنجاح';
                    statusDiv.className = isBackgroundMode ? 'status background-active' : 'status success';
                    responseTimeDiv.textContent = `${responseTime} مللي ثانية`;

                    addLog(`✅ السيرفر متصل - الاستجابة: ${responseTime}ms`, 'success');
                    
                    // إشعار متقطع في وضع الخلفية
                    if (isBackgroundMode && checkCount % 20 === 0) {
                        showNotification(`✅ السيرفر يعمل بنجاح - فحص #${checkCount + 1}`);
                        
                        // إشعار متصفح إذا كان مدعوم
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification('مراقب السيرفر', {
                                body: `✅ السيرفر يعمل بنجاح - فحص #${checkCount + 1}`,
                                icon: 'img/logo-app_1.png',
                                tag: 'server-check',
                                silent: true
                            });
                        }
                    }
                } else {
                    throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                }
                
            } catch (error) {
                const checkEndTime = Date.now();
                const responseTime = checkEndTime - checkStartTime;
                
                // تحديث الواجهة - حالة فشل
                statusDiv.textContent = isBackgroundMode ? '🌙 وضع الخلفية - السيرفر غير متاح' : '❌ السيرفر غير متاح';
                statusDiv.className = 'status fail';
                responseTimeDiv.textContent = `فشل (${responseTime}ms)`;
                
                addLog(`❌ فشل الاتصال: ${error.message}`, 'error');
                
                // إشعار فوري في حالة الفشل
                if (isBackgroundMode) {
                    showNotification(`❌ فشل الاتصال بالسيرفر!`);
                    
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('تحذير - مراقب السيرفر', {
                            body: '❌ فشل الاتصال بالسيرفر!',
                            icon: 'img/logo-app_1.png',
                            tag: 'server-error',
                            requireInteraction: true
                        });
                    }
                }
            }

            // تحديث معلومات الفحص
            checkCount++;
            checkCountDiv.textContent = checkCount;
            lastCheckDiv.textContent = new Date().toLocaleTimeString('ar-SA');

            // حفظ الإحصائيات
            localStorage.setItem('serverStats', JSON.stringify({
                checkCount,
                lastCheck: new Date().toISOString(),
                isBackgroundMode,
                startTime
            }));
        }

        // دالة إظهار الإشعارات
        function showNotification(message) {
            notification.textContent = message;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }

        // دالة بدء المراقبة التلقائية
        function startAutoCheck() {
            if (isAutoChecking) {
                addLog('المراقبة التلقائية تعمل بالفعل', 'warning');
                return;
            }
            
            isAutoChecking = true;
            monitorStatusDiv.textContent = 'نشط';
            autoBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            
            // فحص فوري
            checkServer();
            
            // فحص كل 30 ثانية في وضع الخلفية، كل دقيقة في الوضع العادي
            const interval = isBackgroundMode ? 30000 : 60000;
            autoCheckInterval = setInterval(checkServer, interval);
            
            addLog(`🚀 بدأت المراقبة التلقائية - فحص كل ${isBackgroundMode ? '30 ثانية' : 'دقيقة'}`, 'success');
        }

        // دالة إيقاف المراقبة التلقائية
        function stopAutoCheck() {
            if (!isAutoChecking) {
                addLog('المراقبة التلقائية متوقفة بالفعل', 'warning');
                return;
            }
            
            isAutoChecking = false;
            clearInterval(autoCheckInterval);
            autoCheckInterval = null;
            
            monitorStatusDiv.textContent = 'متوقف';
            autoBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            
            addLog('⏹️ تم إيقاف المراقبة التلقائية', 'info');
        }

        // دالة تفعيل/إلغاء وضع الخلفية
        async function toggleBackgroundMode() {
            if (!isBackgroundMode) {
                // تفعيل وضع الخلفية
                try {
                    // طلب إبقاء الشاشة مستيقظة
                    if ('wakeLock' in navigator) {
                        try {
                            wakeLock = await navigator.wakeLock.request('screen');
                            addLog('🔒 تم تفعيل حفظ الشاشة نشطة', 'background');
                            
                            wakeLock.addEventListener('release', () => {
                                addLog('⚠️ تم إطلاق قفل الشاشة', 'warning');
                            });
                        } catch (wakeLockError) {
                            addLog('⚠️ فشل في تفعيل قفل الشاشة', 'warning');
                        }
                    }
                    
                    // طلب إذن الإشعارات
                    if ('Notification' in window) {
                        const permission = await Notification.requestPermission();
                        if (permission === 'granted') {
                            addLog('🔔 تم منح إذن الإشعارات', 'background');
                        }
                    }
                    
                    isBackgroundMode = true;
                    backgroundStatusDiv.textContent = 'نشط';
                    backgroundBtn.textContent = '☀️ وضع عادي';
                    backgroundBtn.classList.add('active');
                    backgroundIndicator.style.display = 'block';
                    
                    addLog('🌙 تم تفعيل وضع الخلفية - المراقبة المتقدمة نشطة', 'background');
                    showNotification('تم تفعيل وضع الخلفية! الصفحة ستعمل في الخلفية بشكل مستمر.');
                    
                    // إعادة تشغيل المراقبة بفترة أقصر
                    if (isAutoChecking) {
                        stopAutoCheck();
                        setTimeout(startAutoCheck, 1000);
                    } else {
                        // بدء تلقائي في وضع الخلفية
                        setTimeout(startAutoCheck, 2000);
                    }
                    
                    // تغيير عنوان الصفحة
                    document.title = '🌙 مراقب السيرفر (خلفية)';
                    
                } catch (err) {
                    addLog(`❌ فشل في تفعيل وضع الخلفية: ${err.message}`, 'error');
                }
            } else {
                // إلغاء وضع الخلفية
                isBackgroundMode = false;
                backgroundStatusDiv.textContent = 'غير نشط';
                backgroundBtn.textContent = '🌙 وضع الخلفية';
                backgroundBtn.classList.remove('active');
                backgroundIndicator.style.display = 'none';
                
                // إطلاق حفظ الشاشة
                if (wakeLock) {
                    wakeLock.release();
                    wakeLock = null;
                }
                
                document.title = 'مراقب السيرفر النشط - خدمة الخلفية';
                
                addLog('☀️ تم إلغاء وضع الخلفية - العودة للوضع العادي', 'info');
                
                // إعادة تشغيل المراقبة بالفترة العادية
                if (isAutoChecking) {
                    stopAutoCheck();
                    setTimeout(startAutoCheck, 1000);
                }
            }
        }

        // منع إغلاق الصفحة في وضع الخلفية
        window.addEventListener('beforeunload', function(e) {
            if (isBackgroundMode) {
                e.preventDefault();
                e.returnValue = 'الصفحة تعمل في وضع الخلفية. هل تريد إغلاقها حقاً؟';
                return e.returnValue;
            }
        });

        // التعامل مع تغيير visibility
        document.addEventListener('visibilitychange', function() {
            if (isBackgroundMode) {
                if (document.hidden) {
                    addLog('📱 الصفحة في الخلفية - الاستمرار في المراقبة', 'background');
                    document.title = '🌙 مراقب نشط (مخفي)';
                } else {
                    addLog('👁️ عودة إلى المقدمة - المراقبة مستمرة', 'background');
                    document.title = '🌙 مراقب السيرفر (خلفية)';
                }
            }
        });

        // تسجيل Service Worker
        async function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('service-worker.js');
                    addLog('📱 تم تسجيل Service Worker بنجاح', 'info');
                } catch (error) {
                    addLog(`⚠️ فشل تسجيل Service Worker: ${error.message}`, 'warning');
                }
            }
        }

        // استرداد البيانات المحفوظة
        function restoreData() {
            const saved = localStorage.getItem('serverStats');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    checkCount = data.checkCount || 0;
                    checkCountDiv.textContent = checkCount;
                    
                    if (data.startTime) {
                        startTime = data.startTime;
                    }
                    
                    addLog('📂 تم استرداد بيانات الجلسة السابقة', 'info');
                } catch (e) {
                    addLog('⚠️ فشل في استرداد البيانات المحفوظة', 'warning');
                }
            }
            
            // استرداد السجلات
            const logs = JSON.parse(localStorage.getItem('backgroundLogs') || '[]');
            logs.slice(-10).forEach(log => {
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry log-${log.type}`;
                logEntry.textContent = `[${log.timestamp}] ${log.message}`;
                logContainer.appendChild(logEntry);
            });
        }

        // بدء تلقائي عند تحميل الصفحة
        window.addEventListener('load', async function() {
            addLog('تم تحميل مراقب السيرفر المتقدم بنجاح', 'success');
            
            // تسجيل Service Worker
            await registerServiceWorker();
            
            // استرداد البيانات
            restoreData();
            
            // بدء عداد وقت التشغيل
            uptimeInterval = setInterval(updateUptime, 1000);
            
            // فحص فوري بعد ثانية
            setTimeout(checkServer, 1000);
            
            // بدء المراقبة التلقائية بعد 3 ثوان
            setTimeout(() => {
                if (!isAutoChecking) {
                    startAutoCheck();
                }
            }, 3000);
            
            // حفظ دوري للبيانات
            setInterval(() => {
                if (isAutoChecking || isBackgroundMode) {
                    localStorage.setItem('serverStats', JSON.stringify({
                        checkCount,
                        lastCheck: new Date().toISOString(),
                        isBackgroundMode,
                        startTime
                    }));
                }
            }, 30000);
        });

        // تنظيف عند إغلاق الصفحة
        window.addEventListener('beforeunload', function() {
            if (autoCheckInterval) {
                clearInterval(autoCheckInterval);
            }
            if (uptimeInterval) {
                clearInterval(uptimeInterval);
            }
            if (wakeLock) {
                wakeLock.release();
            }
        });

        // ping إضافي لمنع نوم السيرفر في وضع الخلفية
        setInterval(async () => {
            if (isBackgroundMode) {
                try {
                    await fetch(`${SERVER_BASE}/ping`, {
                        method: 'GET',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                } catch (e) {
                    // فشل صامت
                }
            }
        }, 90000); // كل دقيقة ونصف

    </script>
</body>
</html>
