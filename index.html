<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#2196f3"><title>تسجيل الدخول</title><link rel="icon" href="img/logo-albasmahart.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.json"><style>:root{font-family:"Cairo","Segoe UI",Tahoma,sans-serif}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#328cc0,#00bcd4)}.login-card{width:min(100%,480px);padding:36px 30px 28px;border-radius:20px;background:rgba(255,255,255,.96) url("img/bg.gif") center/cover no-repeat;box-shadow:0 18px 60px rgba(0,44,74,.25);text-align:center}.logo{width:120px;max-width:35%}h1{margin:12px 0 24px;color:#267ca9}.field{margin-bottom:17px;text-align:right}label{display:block;margin-bottom:7px;color:#226f99;font-weight:700}input,button{width:100%;min-height:54px;padding:12px 16px;border-radius:12px;font:inherit}input{border:2px solid #b6e7ee;background:#f8fcfd;text-align:center}button{border:0;color:#fff;background:linear-gradient(90deg,#328cc0,#00bcd4);font-weight:700;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.68}#installButton{display:none;margin-top:12px}.message{min-height:26px;margin:14px 0 0;font-weight:600}.error{color:#b42318}.success{color:#087443}.install-note,footer{color:#51707e;font-size:.9rem}@media(max-width:600px){body{padding:0;background:#fff}.login-card{min-height:100vh;border-radius:0;box-shadow:none;display:flex;flex-direction:column;justify-content:center}}</style></head><body><main class="login-card"><img class="logo" src="img/logo-albasmahart.png" alt="شعار البصمة الفنية"><h1>تسجيل الدخول</h1><form id="loginForm"><div class="field"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required maxlength="64"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"></div><button id="loginButton">دخول</button><p id="message" class="message" role="status"></p></form><button id="installButton" type="button">تثبيت التطبيق</button><p id="installNote" class="install-note">ثبّت التطبيق لسهولة وسرعة الوصول.</p><footer>البصمة الفنية <span id="year"></span></footer></main><script>const form=document.getElementById('loginForm'),loginButton=document.getElementById('loginButton'),message=document.getElementById('message'),installButton=document.getElementById('installButton'),installNote=document.getElementById('installNote');let deferredPrompt=null;document.getElementById('year').textContent=new Date().getFullYear();function showMessage(text,type=''){message.textContent=text;message.className=`message ${type}`.trim()}if(location.protocol==='file:'){showMessage('هذه الصفحة مفتوحة كملف، لذلك PHP وتسجيل الدخول لن يعملا. افتح الموقع من رابط http:// بدلًا من file://.','error');loginButton.disabled=true;loginButton.textContent='شغّل خادم PHP أولًا'}async function checkExistingSession(){if(location.protocol==='file:')return;try{const response=await fetch('server.php?action=session',{credentials:'same-origin',cache:'no-store'});if(!response.ok)return;const session=await response.json();if(session.authenticated)location.replace('categories.html')}catch(error){console.warn(error)}}form.addEventListener('submit',async event=>{event.preventDefault();if(location.protocol==='file:')return;const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!username||!password){showMessage('يرجى إدخال اسم المستخدم وكلمة المرور.','error');return}loginButton.disabled=true;loginButton.textContent='جارٍ التحقق...';showMessage('');try{const response=await fetch('server.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}),result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||'تعذر تسجيل الدخول.');localStorage.setItem('loggedIn','true');localStorage.setItem('username',result.username||username);localStorage.setItem('role',result.role||'user');location.replace('categories.html')}catch(error){showMessage(error.message||'تعذر الاتصال بالخادم.','error')}finally{loginButton.disabled=false;loginButton.textContent='دخول'}});window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;installButton.style.display='block'});installButton.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installButton.style.display='none'};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(console.warn));checkExistingSession();</script></body></html>
