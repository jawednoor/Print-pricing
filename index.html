<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="تسعير الديجتال">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2196f3">
  <title>تسجيل الدخول</title>
  <link rel="icon" type="image/png" href="img/logo-albasmahart.png">
  <link rel="apple-touch-icon" href="img/logo-albasmahart.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #328cc0 0%, #00bcd4 100%);
    }
    .login-card {
      width: min(100%, 480px);
      padding: 36px 30px 28px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96) url("img/bg.gif") center/cover no-repeat;
      box-shadow: 0 18px 60px rgba(0, 44, 74, 0.25);
      text-align: center;
    }
    .logo { width: 120px; max-width: 35%; height: auto; }
    h1 { margin: 12px 0 24px; color: #267ca9; font-size: clamp(1.5rem, 5vw, 2rem); }
    .field { margin-bottom: 17px; text-align: right; }
    label { display: block; margin-bottom: 7px; color: #226f99; font-weight: 700; }
    input {
      width: 100%;
      min-height: 56px;
      padding: 12px 16px;
      border: 2px solid #b6e7ee;
      border-radius: 12px;
      background: #f8fcfd;
      color: #17384a;
      font: inherit;
      font-size: 1.08rem;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #1aa6bf; box-shadow: 0 0 0 4px rgba(26, 166, 191, 0.13); }
    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(90deg, #328cc0, #00bcd4);
      font: inherit;
      font-weight: 700;
      font-size: 1.08rem;
      cursor: pointer;
    }
    button:hover { background: linear-gradient(90deg, #267ca9, #00a7bb); }
    button:disabled { cursor: wait; opacity: 0.68; }
    #installButton { display: none; margin-top: 12px; background: linear-gradient(90deg, #159957, #38b878); }
    .message { min-height: 26px; margin: 14px 0 0; font-weight: 600; }
    .message.error { color: #b42318; }
    .message.success { color: #087443; }
    .install-note, footer { color: #51707e; font-size: 0.9rem; }
    .install-note { margin: 10px 0 0; }
    footer { margin-top: 14px; }
    @media (max-width: 600px) {
      body { padding: 0; background: #fff; }
      .login-card { min-height: 100dvh; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; justify-content: center; padding: 28px 18px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <img class="logo" src="img/logo-albasmahart.png" alt="شعار البصمة الفنية">
    <h1>تسجيل الدخول</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" required maxlength="64">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      </div>
      <button id="loginButton" type="submit">دخول</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <button id="installButton" type="button">تثبيت التطبيق</button>
    <p id="installNote" class="install-note">ثبّت التطبيق لسهولة وسرعة الوصول.</p>
    <footer>البصمة الفنية <span id="year"></span></footer>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const message = document.getElementById('message');
    const installButton = document.getElementById('installButton');
    const installNote = document.getElementById('installNote');
    let deferredPrompt = null;

    document.getElementById('year').textContent = new Date().getFullYear();

    function showMessage(text, type = '') {
      message.textContent = text;
      message.className = `message ${type}`.trim();
    }

    async function checkExistingSession() {
      try {
        const response = await fetch('server.php?action=session', {
          credentials: 'same-origin',
          cache: 'no-store'
        });
        if (!response.ok) return;
        const session = await response.json();
        if (session.authenticated) {
          localStorage.setItem('loggedIn', 'true');
          localStorage.setItem('username', session.username || '');
          localStorage.setItem('role', session.role || 'user');
          window.location.replace('categories.html');
        }
      } catch (error) {
        console.warn('Session check unavailable', error);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showMessage('يرجى إدخال اسم المستخدم وكلمة المرور.', 'error');
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = 'جارٍ التحقق...';
      showMessage('');

      try {
        const response = await fetch('server.php?action=login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.success) {
          throw new Error(result.message || 'تعذر تسجيل الدخول.');
        }

        localStorage.setItem('loggedIn', 'true');
        localStorage.setItem('username', result.username || username);
        localStorage.setItem('role', result.role || 'user');
        showMessage('تم تسجيل الدخول بنجاح.', 'success');
        window.location.replace('categories.html');
      } catch (error) {
        showMessage(error.message || 'تعذر الاتصال بالخادم.', 'error');
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'دخول';
      }
    });

    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (standalone) installNote.hidden = true;

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.style.display = 'block';
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installButton.style.display = 'none';
      installNote.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((error) => {
          console.warn('Service worker registration failed', error);
        });
      });
    }

    checkExistingSession();
  </script>
</body>
</html>
