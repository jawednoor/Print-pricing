<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-ti    // الاستماع لرسائل من service worker
    navigator.serviceWorker.addEventListener('message', function(event) {
      if (event.data && (event.data.type === 'SW_UPDATED' || event.data.type === 'FORCE_RELOAD')) {
        console.log('إجبار إعادة تحميل للتحديث:', event.data.message);
        // مسح جميع الكاشات من المتصفح
        if ('caches' in window) {
          caches.keys().then(function(cacheNames) {
            cacheNames.forEach(function(cacheName) {
              caches.delete(cacheName);
            });
          });
        }
        // إعادة تحميل قوية مع تجاهل الكاش
        setTimeout(() => {
          window.location.href = window.location.href + '?force=' + Date.now();
        }, 500);
      }
    });nt="تسعير الديجتال">
	<meta name="mobile-web-app-capable" content="yes">
	<title>تسجيل الدخول</title>
	<link rel="icon" type="image/png" href="img/logo-albasmahart.png">
	<link rel="apple-touch-icon" href="img/logo-albasmahart.png">
	<link rel="apple-touch-icon" sizes="180x180" href="img/logo-albasmahart.png">
	<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#2196f3">
	<style>
		html, body {
			height: 100%;
			min-height: 100%;
			margin: 0;
			padding: 0;
			overflow-y: hidden !important;
		}
		body {
			background: linear-gradient(135deg, #328cc0 0%, #00bcd4 100%);
			font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			height: 100vh;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.login-container {
			background: url('img/bg.gif') center center/cover no-repeat;
			border-radius: 18px;
			box-shadow: none;
			padding: 32px 12px 24px 12px;
			max-width: 440px;
			width: 100%;
			text-align: center;
			min-height: 100vh;
			height: 100vh;
		}
		.logo {
			width: 110px;
			margin-bottom: 18px;
		}
		h2 {
			color: #328cc0;
			font-size: 1.7em;
			margin-bottom: 18px;
			font-weight: bold;
			letter-spacing: 1px;
		}
		.input-group {
			margin-bottom: 18px;
			text-align: right;
		}
		label {
			display: block;
			margin-bottom: 6px;
			color: #328cc0;
			font-weight: bold;
			font-size: 1em;
		}
		input[type="text"], input[type="password"] {
			text-align: center;
			width: 98%;
			min-width: 0;
			max-width: 440px;
			height: 54px;
			padding: 18px 18px;
			border: 2px solid #00bcd4;
			border-radius: 12px;
			font-size: 1.25em;
			font-family: 'Cairo', sans-serif;
			background: #f7fafd;
			transition: border 0.2s;
			box-sizing: border-box;
			margin: 0 0 18px 0;
			display: block;
		}
		input[type="text"]:focus, input[type="password"]:focus {
			border-color: #328cc0;
			outline: none;
		}
		.login-btn {
			width: 100%;
			padding: 12px;
			background: linear-gradient(90deg, #328cc0 0%, #00bcd4 100%);
			color: #fff;
			border: none;
			border-radius: 8px;
			font-size: 1.1em;
			font-weight: bold;
			cursor: pointer;
			margin-top: 8px;
			box-shadow: 0 2px 8px #328cc033;
			transition: background 0.2s;
		}
		@media (max-width: 600px) {
			body {
				align-items: flex-start;
				justify-content: center;
			}
			.login-container {
				max-width: 100vw;
				min-height: 100vh;
				border-radius: 0;
				padding: 32px 8px 24px 8px;
				box-shadow: none;
			}
			input[type="text"], input[type="password"] {
				font-size: 1.1em;
				padding: 18px 10px;
				border-radius: 10px;
				height: 54px;
				margin-bottom: 18px;
			}
			.login-btn {
				font-size: 1.1em;
				padding: 18px;
				border-radius: 10px;
			}
		}
		.login-btn:hover {
			background: linear-gradient(90deg, #00bcd4 0%, #328cc0 100%);
		}
		.footer {
			margin-top: 18px;
			color: #888;
			font-size: 0.9em;
		}
		body.pwa-blocked {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			background: linear-gradient(135deg, #1cb5e0 0%, #000851 100%);
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.pwa-message-box {
			background: rgba(255,255,255,0.95);
			border-radius: 18px;
			box-shadow: 0 4px 32px #0002;
			padding: 36px 28px 28px 28px;
			text-align: center;
			max-width: 400px;
			margin: auto;
		}
		.pwa-message-box h2 {
			color: #2196f3;
			margin-bottom: 18px;
			font-size: 1.5em;
		}
		.pwa-message-box p {
			color: #d32f2f;
			font-size: 1.15em;
			margin-bottom: 24px;
		}
		.pwa-btn {
			background: linear-gradient(90deg,#2196f3 0%,#1cb5e0 100%);
			color: #fff;
			border: none;
			border-radius: 10px;
			padding: 14px 36px;
			font-size: 1.1em;
			font-weight: bold;
			cursor: pointer;
			box-shadow: 0 2px 8px #2196f344;
			transition: background 0.2s;
		}
		.pwa-btn:active {
			background: linear-gradient(90deg,#1cb5e0 0%,#2196f3 100%);
		}
		.login-box {
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 2px 16px #2196f344;
			max-width: 340px;
			margin: 80px auto;
			padding: 32px 24px 24px 24px;
			text-align: center;
		}
		.login-box h2 {
			color: #2196f3;
			margin-bottom: 18px;
		}
		.login-box input {
			width: 90%;
			padding: 12px;
			margin-bottom: 16px;
			border-radius: 8px;
			border: 1px solid #bbb;
			font-size: 1.1em;
			font-family: 'Cairo', sans-serif;
			background: #f7fafd;
			box-sizing: border-box;
		}
		.login-box button {
			background: linear-gradient(90deg,#2196f3 0%,#1cb5e0 100%);
			color: #fff;
			border: none;
			border-radius: 10px;
			padding: 12px 36px;
			font-size: 1.1em;
			font-weight: bold;
			cursor: pointer;
			box-shadow: 0 2px 8px #2196f344;
			transition: background 0.2s;
		}
		.login-box button:active {
			background: linear-gradient(90deg,#1cb5e0 0%,#2196f3 100%);
		}
		.login-error {
			color: #d32f2f;
			margin-bottom: 12px;
			font-size: 1em;
		}
	</style>
</head>

<body>
	<div class="login-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
		<img src="img/logo-albasmahart.png" alt="شعار البسمة آرت" class="logo" style="margin-top: 5px; margin-bottom: 10px;">
		<h2 style="margin-bottom: 10px; margin-top: 5px;">تسجيل الدخول</h2>
		<form id="loginForm" style="width: 100%; max-width: 440px;">
			<div class="input-group" style="width:100%;max-width:440px;margin:0 auto 18px auto;">
				<label for="username">اسم المستخدم</label>
				<input type="text" id="username" name="username" autocomplete="username" style="width:100%;">
			</div>
			<div class="input-group" style="width:100%;max-width:440px;margin:0 auto 18px auto;">
				<label for="password">كلمة المرور</label>
				<input type="password" id="password" name="password" autocomplete="current-password" maxlength="6" style="width:100%;">
			</div>
			<button type="submit" class="login-btn">دخول</button>
			<div style="height: 16px;"></div>
			<button type="button" id="install-btn" class="pwa-btn" style="display:none;width:100%;max-width:440px;margin:0 auto 0 auto;padding:12px 0;font-size:1.05em;min-width:100%;background:linear-gradient(90deg,#43e97b 0%,#38f9d7 100%);border-radius:10px;">تثبيت التطبيق</button>
			<div style="color:#009688;font-size:0.98em;margin-top:8px;margin-bottom:0;text-align:center;font-weight:500;">ثبّت التطبيق لسهولة وسرعة الوصول إلى خدماتنا!</div>
			<div class="footer" style="margin-top: 2px;"> البصمة الفنية 2025</div>
		</form>
	</div>

	<script>
	document.getElementById('loginForm').addEventListener('submit', async function(e) {
		e.preventDefault();
		var username = document.getElementById('username').value.trim();
		var password = document.getElementById('password').value.trim();
		
		// التحقق من أن الحقول ليست فارغة
		if (!username || !password) {
			alert('يرجى إدخال اسم المستخدم وكلمة المرور');
			return;
		}
		
		try {
			const res = await fetch('/user-data.json');
			if (!res.ok) {
				throw new Error('فشل في تحميل بيانات المستخدمين');
			}
			const users = await res.json();
			const found = users.find(u => u.username === username && u.password === password);
			if (found) {
				localStorage.setItem('loggedIn', 'true');
				localStorage.setItem('username', username);
				window.location.href = 'categories.html';
			} else {
				alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
			}
		} catch(e) {
			console.error('خطأ في تسجيل الدخول:', e);
			alert('تعذر التحقق من بيانات الدخول! تأكد من الاتصال بالإنترنت.');
		}
	});
	
	// تسجيل service worker إذا كان مدعومًا
	if ('serviceWorker' in navigator) {
	  window.addEventListener('load', function() {
	    navigator.serviceWorker.register('service-worker.js').then(function(registration) {
	        console.log('Service Worker registered successfully');
	        
	        // إجبار التحقق من التحديثات كل 5 ثوان
	        setInterval(() => {
	          registration.update();
	        }, 5000);
	        
	        // فحص التحديثات فور التسجيل
	        registration.update();
	        
	        // الاستماع للتحديثات
	        registration.addEventListener('updatefound', function() {
	          const newWorker = registration.installing;
	          console.log('تحديث جديد متوفر...');
	          
	          newWorker.addEventListener('statechange', function() {
	            if (newWorker.state === 'installed') {
	              if (navigator.serviceWorker.controller) {
	                console.log('تحديث جديد جاهز - إجبار التنشيط');
	                // إرسال رسالة لإجبار التنشيط
	                newWorker.postMessage({type: 'SKIP_WAITING'});
	                // إعادة تحميل فورية
	                setTimeout(() => {
	                  console.log('إعادة تحميل التطبيق للتحديث');
	                  window.location.reload(true);
	                }, 500);
	              } else {
	                console.log('Service Worker installed for first time');
	              }
	            }
	          });
	        });
	        
	    }).catch(function() {
	        console.log('Service Worker غير متوفر');
	    });
	    
	    // الاستماع لرسائل من service worker
	    navigator.serviceWorker.addEventListener('message', function(event) {
	      if (event.data && event.data.type === 'SW_UPDATED') {
	        console.log(event.data.message);
	        // إعادة تحميل فورية عند تلقي إشعار التحديث
	        setTimeout(() => {
	          window.location.reload(true);
	        }, 1000);
	      }
	    });
	  });
	}

	// زر تثبيت التطبيق كـ PWA
	let deferredPrompt = null;
	let installBtn = document.getElementById('install-btn');
	
	// فحص إذا كان التطبيق يعمل في standalone mode (مُثبت)
	function isStandalone() {
		return window.matchMedia('(display-mode: standalone)').matches || 
			   window.navigator.standalone === true ||
			   document.referrer.includes('android-app://');
	}
	
	// إخفاء زر التثبيت إذا كان التطبيق مُثبت ويعمل
	if (isStandalone()) {
		console.log('التطبيق يعمل في وضع standalone - إخفاء زر التثبيت');
		if (installBtn) {
			installBtn.style.display = 'none';
		}
		// إخفاء النص التوضيحي أيضاً
		var installText = installBtn ? installBtn.nextElementSibling : null;
		if (installText) {
			installText.style.display = 'none';
		}
	} else {
		console.log('التطبيق يعمل في المتصفح - إظهار زر التثبيت');
		
		// الاستماع لحدث beforeinstallprompt
		window.addEventListener('beforeinstallprompt', function(e) {
			console.log('PWA install prompt available');
			e.preventDefault();
			deferredPrompt = e;
			
			// إظهار زر التثبيت
			if (installBtn) {
				installBtn.style.display = 'block';
			}
		});
		
		// إظهار الزر على localhost للاختبار
		if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
			window.addEventListener('load', function() {
				if (installBtn) {
					installBtn.style.display = 'block';
				}
			});
		}
		
		// وظيفة تثبيت التطبيق
		if (installBtn) {
			installBtn.addEventListener('click', async function() {
				if (deferredPrompt) {
					console.log('Installing PWA...');
					
					// إظهار نافذة التثبيت
					deferredPrompt.prompt();
					
					// انتظار رد المستخدم
					const choiceResult = await deferredPrompt.userChoice;
					
					if (choiceResult.outcome === 'accepted') {
						console.log('PWA installed successfully');
						// إخفاء زر التثبيت بعد التثبيت
						installBtn.style.display = 'none';
						// إخفاء النص التوضيحي أيضاً
						var installText = installBtn.nextElementSibling;
						if (installText) {
							installText.style.display = 'none';
						}
					} else {
						console.log('PWA installation cancelled');
					}
					
					// إعادة تعيين المتغير
					deferredPrompt = null;
				} else {
					console.log('PWA install prompt not available');
					// على localhost أو إذا لم يكن متاحاً
					if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
						alert('اختبار زر التثبيت - سيعمل على الخادم الحقيقي والأجهزة المدعومة');
					} else {
						// إخفاء الزر إذا لم يكن متاحاً
						installBtn.style.display = 'none';
					}
				}
			});
		}
		
		// التحقق من حالة التثبيت
		window.addEventListener('appinstalled', function(e) {
			console.log('PWA was installed');
			if (installBtn) {
				installBtn.style.display = 'none';
			}
			// إخفاء النص التوضيحي أيضاً
			var installText = installBtn ? installBtn.nextElementSibling : null;
			if (installText) {
				installText.style.display = 'none';
			}
		});
	}

		//////////////////////////////////
	    //=========================
        // كود إخفاء سكريبت من F12
        //=========================
        (function removeScriptTagsFromDOM() {
            try {
                // إخفاء جميع وسوم <script> من عناصر DevTools (F12) عند تحميل الصفحة
                if (window.location.href.startsWith('http://localhost:3000/')) return;
                var scripts = document.querySelectorAll('script');
                scripts.forEach(function(s) {
                    s.parentNode && s.parentNode.removeChild(s);
                });
            } catch(e) {}
        })();
        //=========================
        //نهاية كود إخفاء سكريبت من F12
        //========================

		
		////////////////////////////////
        // ==========================
        // تعطيل console.log في بيئة الإنتاج فقط (ليس على localhost)
        // ==========================
        //  
        if (typeof console !== "undefined" && window.location.hostname !== "localhost") {
            console.log = function () {};
        }
        //=========================================
        // نهاية كود تعطيل console.log
        //=========================================

	</script>
	
	<!-- معالج التحديثات المحسّن -->
	<script src="update-handler.js"></script>
	
	<!-- خدمة إبقاء السيرفر نشطاً -->
	<script>
	// دالة ping لإبقاء السيرفر نشطاً
	function keepServerAlive() {
		// تجنب إرسال ping في بيئة التطوير المحلية
		if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
			return;
		}
		
		fetch('/ping', {
			method: 'GET',
			headers: {
				'Cache-Control': 'no-cache'
			}
		}).then(response => {
			if (response.ok) {
				console.log('Server ping successful:', new Date().toLocaleTimeString('ar-SA'));
			}
		}).catch(error => {
			console.log('Server ping failed:', error.message);
		});
	}
	
	// بدء خدمة keep-alive بعد تحميل الصفحة
	window.addEventListener('load', function() {
		// ping فوري بعد 10 ثوان من التحميل
		setTimeout(keepServerAlive, 10000);
		
		// ثم ping كل 3 دقائق
		setInterval(keepServerAlive, 180000);
	});
	</script>
</body>
</html>
